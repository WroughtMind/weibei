name: 魏碑双架构正式发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: "与 VERSION/package.json 一致的 major.minor.patch（不含 v）"
        required: true
        type: string
      publish:
        description: "公开发布版本；不勾选时只构建并验证，不创建 Tag 或 Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weibei-production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: 校验发布来源与版本
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 只允许从 main 正式发布
        id: source
        env:
          RELEASE_REF: ${{ github.ref }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            test "$RELEASE_REF" = "refs/heads/main"
          fi

      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 校验版本、更新摘要与未重复发布
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          build_number="$(python3 script/build_number.py)"
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -n "$previous_tag" ]]; then
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" --pattern 'appcast*.xml' --dir "$RUNNER_TEMP/previous-feeds"
            for feed in "$RUNNER_TEMP"/previous-feeds/appcast*.xml; do
              python3 script/build_number.py "$build_number" --after-feed "$feed"
            done
          fi
          printf 'build_number=%s\n' "$build_number" >> "$GITHUB_OUTPUT"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          test "$(node -p 'require("./package.json").version')" = "$RELEASE_VERSION"
          test -s "Docs/update-summaries/v$RELEASE_VERSION.md"
          test -s "Docs/releases/v$RELEASE_VERSION.md"
          ! git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"
          ! gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          printf 'value=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    env:
      WEIBEI_BUILD_NUMBER: ${{ needs.authorize.outputs.build_number }}
    name: 构建 ${{ matrix.arch }} 正式资产
    needs: authorize
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 验证原生 runner
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$TARGET_ARCH"
          swift --version
          xcodebuild -version

      - name: 安装固定构建依赖
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/weibei-editor-fonts"
          "$RUNNER_TEMP/weibei-editor-fonts/bin/pip" install -r script/editor-font-requirements.txt
          echo "$RUNNER_TEMP/weibei-editor-fonts/bin" >> "$GITHUB_PATH"

      - name: 准备 Sparkle 发布密钥
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.WEIBEI_SPARKLE_PRIVATE_KEY_BASE64 }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.WEIBEI_SPARKLE_PUBLIC_KEY }}
        run: |
          umask 077
          test -n "$SPARKLE_PRIVATE_KEY_BASE64"
          test -n "$SPARKLE_PUBLIC_KEY"
          # Keep the release key compatible with the public key embedded in existing builds.
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          source = Path("script/build_and_run.sh").read_text()
          match = re.search(r'SPARKLE_PUBLIC_KEY="\$\{WEIBEI_SPARKLE_PUBLIC_KEY:-([^}]+)\}"', source)
          if not match or os.environ["SPARKLE_PUBLIC_KEY"] != match.group(1):
              raise SystemExit("Sparkle release public key differs from the repository's installed-app key; stop before publishing.")
          PYTHON
          /usr/bin/printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D -o "$RUNNER_TEMP/weibei-sparkle-private-key"
          test -s "$RUNNER_TEMP/weibei-sparkle-private-key"
          chmod 600 "$RUNNER_TEMP/weibei-sparkle-private-key"

      - name: 通过唯一 Catalyst 入口构建、签名并验证当前架构 DMG
        env:
          WEIBEI_TARGET_ARCH: ${{ matrix.arch }}
          WEIBEI_SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/weibei-sparkle-private-key
          WEIBEI_SPARKLE_PUBLIC_KEY: ${{ secrets.WEIBEI_SPARKLE_PUBLIC_KEY }}
          WEIBEI_REQUIRE_APPCAST: "1"
          WEIBEI_VERIFY_LAUNCH: "1"
        run: ./script/build_release_dmg.sh --arch "${{ matrix.arch }}"

      - name: 再验收公开资产集合
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          release_dir="dist/release/$TARGET_ARCH"
          dmg="WeiBei-$RELEASE_VERSION-macOS-$TARGET_ARCH.dmg"
          test -s "$release_dir/$dmg"
          test -s "$release_dir/$dmg.sha256"
          test -s "$release_dir/appcast-$TARGET_ARCH.xml"
          (cd "$release_dir" && shasum -a 256 -c "$dmg.sha256")
          grep -Fq "$dmg" "$release_dir/appcast-$TARGET_ARCH.xml"
          if [[ "$TARGET_ARCH" == "arm64" ]]; then
            cmp "$release_dir/appcast-arm64.xml" "$release_dir/appcast.xml"
          fi
          # All upload paths share this directory, so the downloaded assets stay at the root.
          cp "dist/package-$TARGET_ARCH.json" "$release_dir/package-$TARGET_ARCH.json"

      - name: 验证更新引擎安装与篡改拒绝
        env:
          WEIBEI_SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/weibei-sparkle-private-key
          WEIBEI_SPARKLE_PUBLIC_KEY: ${{ secrets.WEIBEI_SPARKLE_PUBLIC_KEY }}
        run: python3 script/verify_update_installation.py --arch "${{ matrix.arch }}"

      - name: 保留更新安装检查证据
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-verification-${{ matrix.arch }}
          path: dist/release/${{ matrix.arch }}/update-verification-*
          if-no-files-found: ignore
          retention-days: 14

      - name: 保存架构发布资产
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/release/${{ matrix.arch }}/WeiBei-${{ needs.authorize.outputs.version }}-macOS-${{ matrix.arch }}.dmg
            dist/release/${{ matrix.arch }}/WeiBei-${{ needs.authorize.outputs.version }}-macOS-${{ matrix.arch }}.dmg.sha256
            dist/release/${{ matrix.arch }}/appcast-${{ matrix.arch }}.xml
            dist/release/${{ matrix.arch }}/appcast.xml
            dist/release/${{ matrix.arch }}/WeiBei-*.dSYM/**
            dist/release/${{ matrix.arch }}/package-${{ matrix.arch }}.json
            dist/release/${{ matrix.arch }}/update-verification-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

      - name: 清理临时发布密钥
        if: ${{ always() }}
        run: /bin/rm -f "$RUNNER_TEMP/weibei-sparkle-private-key"

  prepare:
    env:
      WEIBEI_BUILD_NUMBER: ${{ needs.authorize.outputs.build_number }}
    name: 汇总并验证完整候选资产
    needs: [authorize, build]
    runs-on: macos-26

    steps:
      - name: 取出发布工具
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 下载苹果芯片资产
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-arm64
          path: dist/publish

      - name: 下载英特尔资产
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-x86_64
          path: dist/publish

      - name: 汇总校验并生成双架构 Homebrew Cask
        env:
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          npm ci
          for arch in arm64 x86_64; do
            dmg="WeiBei-$RELEASE_VERSION-macOS-$arch.dmg"
            test -s "dist/publish/$dmg"
            test -s "dist/publish/$dmg.sha256"
            test -s "dist/publish/appcast-$arch.xml"
            (cd dist/publish && shasum -a 256 -c "$dmg.sha256")
            grep -Fq "$dmg" "dist/publish/appcast-$arch.xml"
            feed_build="$(xmllint --xpath 'string((/rss/channel/item/*[local-name()="version"] | /rss/channel/item/enclosure/@*[local-name()="version"])[1])' "dist/publish/appcast-$arch.xml")"
            test "$feed_build" = "$WEIBEI_BUILD_NUMBER"
          done
          cmp dist/publish/appcast-arm64.xml dist/publish/appcast.xml
          arm_sha="$(awk '{print $1}' "dist/publish/WeiBei-$RELEASE_VERSION-macOS-arm64.dmg.sha256")"
          intel_sha="$(awk '{print $1}' "dist/publish/WeiBei-$RELEASE_VERSION-macOS-x86_64.dmg.sha256")"
          npx tsx script/homebrew/generate_cask.ts \
            "$RELEASE_VERSION" "$arm_sha" "$intel_sha" \
            dist/publish/weibei.rb
          ruby -c dist/publish/weibei.rb
          symbol_count="$(find dist/publish -maxdepth 1 -type d -name 'WeiBei-*.dSYM' | wc -l | tr -d ' ')"
          test "$symbol_count" = "2"
          mkdir -p dist/publish/debug-symbols
          while IFS= read -r symbol; do
            ditto "$symbol" "dist/publish/debug-symbols/$(basename "$symbol")"
          done < <(find dist/publish -maxdepth 1 -type d -name 'WeiBei-*.dSYM' | sort)
          ditto -c -k --sequesterRsrc --keepParent \
            dist/publish/debug-symbols \
            "dist/publish/WeiBei-$RELEASE_VERSION-debug-symbols.zip"
          unzip -t "dist/publish/WeiBei-$RELEASE_VERSION-debug-symbols.zip"
          cp "Docs/releases/v$RELEASE_VERSION.md" dist/publish/release-notes.md
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist/publish')
          for arch in ['arm64', 'x86_64']:
              package = json.loads((root / f'package-{arch}.json').read_text())
              assert package['source_revision'] == os.environ['GITHUB_SHA'], arch
              assert package['source_dirty'] is False, arch
              assert package['architecture'] == arch, arch
              expected_name = f"WeiBei-{os.environ['RELEASE_VERSION']}-macOS-{arch}.dmg"
              assert package['download_file'] == expected_name, arch
              assert package['download_bytes'] == (root / expected_name).stat().st_size, arch
              update = json.loads((root / f'update-verification-{arch}.json').read_text())
              assert update['passed'] and update['actual_sparkle_installation_passed'], arch
              assert update['source_revision'] == os.environ['GITHUB_SHA'], arch
              assert update['build_number'] == os.environ['WEIBEI_BUILD_NUMBER'], arch
              assert update['dmg_sha256'] == hashlib.sha256((root / expected_name).read_bytes()).hexdigest(), arch
          files = sorted(path for path in root.iterdir() if path.is_file())
          record = {
              'version': os.environ['RELEASE_VERSION'],
              'build_number': os.environ['WEIBEI_BUILD_NUMBER'],
              'source_revision': os.environ['GITHUB_SHA'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'architectures': ['arm64', 'x86_64'],
              'files': {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in files},
          }
          (root / 'candidate.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          PYTHON

      - name: 保存可发布候选集合
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-ready
          path: |
            dist/publish/WeiBei-*.dmg
            dist/publish/WeiBei-*.dmg.sha256
            dist/publish/WeiBei-*-debug-symbols.zip
            dist/publish/appcast*.xml
            dist/publish/weibei.rb
            dist/publish/package-*.json
            dist/publish/update-verification-*.json
            dist/publish/release-notes.md
            dist/publish/candidate.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish
    name: 公开已经验证的双架构候选
    needs: [authorize, prepare]
    runs-on: macos-26
    environment: production-release
    permissions:
      contents: write
    steps:
      - name: 下载完整候选集合
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-ready
          path: dist/publish

      - name: 核对下载集合与已验证候选完全一致
        env:
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          WEIBEI_BUILD_NUMBER: ${{ needs.authorize.outputs.build_number }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist/publish')
          record = json.loads((root / 'candidate.json').read_text())
          assert record['version'] == os.environ['RELEASE_VERSION']
          assert record['build_number'] == os.environ['WEIBEI_BUILD_NUMBER']
          assert record['source_revision'] == os.environ['GITHUB_SHA']
          for name, expected in record['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PYTHON

      - name: 创建草稿、上传完整资产后再公开
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --notes-file dist/publish/release-notes.md \
            --title "魏碑 $RELEASE_VERSION"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/publish/WeiBei-*.dmg \
            dist/publish/WeiBei-*.dmg.sha256 \
            "dist/publish/WeiBei-$RELEASE_VERSION-debug-symbols.zip" \
            dist/publish/appcast-arm64.xml \
            dist/publish/appcast-x86_64.xml \
            dist/publish/appcast.xml \
            dist/publish/weibei.rb
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --latest \
            --draft=false
