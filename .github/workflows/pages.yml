name: Deploy marketing website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "script/check_website.sh"
  release:
    types: [published]
  # 自动令牌创建 Release 不会触发 release 事件；监听正式发布流程成功完成。
  workflow_run:
    workflows: ["魏碑双架构正式发布"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # 始终部署已通过合并检查的官网主线，不取发布标签或其他任务的源码。
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Validate and assemble website
        run: bash script/check_website.sh

      - name: Add latest downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -s 'add | map(select(.draft == false and .prerelease == false) | select(any(.assets[]?; (.name | ascii_downcase | test("\\.dmg$"))))) | .[0] // empty'
          )"

          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo '{"available":false}' > _site/release.json
            exit 0
          fi

          tag="$(jq -r '.tag_name' <<<"$release")"
          published_at="$(jq -r '.published_at // ""' <<<"$release")"
          assets="$(jq '[.assets[] | select(.name | ascii_downcase | test("\\.dmg$")) | {name,download_url:.browser_download_url,size}]' <<<"$release")"
          if [ "$(jq 'length' <<<"$assets")" -eq 0 ]; then
            echo '{"available":false}' > _site/release.json
            exit 0
          fi

          jq -n \
            --arg version "$tag" \
            --arg published_at "$published_at" \
            --argjson assets "$assets" \
            '{available:true,version:$version,published_at:$published_at,assets:$assets}' > _site/release.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
