name: Deploy marketing website

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Validate website scripts and download selection
        run: |
          for file in website/*.js website/*.mjs website/qa/*.mjs; do
            node --check "$file"
          done
          node --test website/download-selection.test.mjs

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R website/. _site/
          rm -rf _site/qa
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/feedback.html
          test -s _site/assets/WeiBeiStele.ttf
          test -s _site/assets/第一幕-真实首页截图-去黑边.webp
          test -s _site/paper-fold.css

      - name: Add latest downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -s 'add | map(select(.draft == false and .prerelease == false) | select(any(.assets[]?; (.name | ascii_downcase | test("\\.dmg$"))))) | .[0] // empty'
          )"

          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo '{"available":false}' > _site/release.json
            exit 0
          fi

          tag="$(jq -r '.tag_name' <<<"$release")"
          published_at="$(jq -r '.published_at // ""' <<<"$release")"
          assets="$(jq '[.assets[] | select(.name | ascii_downcase | test("\\.dmg$")) | {name,download_url:.browser_download_url,size}]' <<<"$release")"
          if [ "$(jq 'length' <<<"$assets")" -eq 0 ]; then
            echo '{"available":false}' > _site/release.json
            exit 0
          fi

          jq -n \
            --arg version "$tag" \
            --arg published_at "$published_at" \
            --argjson assets "$assets" \
            '{available:true,version:$version,published_at:$published_at,assets:$assets}' > _site/release.json

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
