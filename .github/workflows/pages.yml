name: Deploy marketing website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R website/. _site/
          rm -rf _site/qa
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/fonts/WeiBeiStele.ttf
          test -s _site/assets/fonts/WeiBeiSteleMono.ttf
          test -s _site/assets/screens/workspace.png
          test -s _site/assets/screens/course-overview.png

      - name: Add latest DMG downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _site/downloads

          release="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -s 'add | map(select(.draft == false) | select(any(.assets[]?; (.name | ascii_downcase | endswith(".dmg"))))) | .[0] // empty'
          )"

          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo '{"available":false}' > _site/release.json
            exit 0
          fi

          tag="$(jq -r '.tag_name' <<<"$release")"
          published_at="$(jq -r '.published_at // ""' <<<"$release")"
          : > /tmp/weibei-dmg-assets.jsonl

          jq -c '.assets[] | select(.name | ascii_downcase | endswith(".dmg"))' <<<"$release" |
            while IFS= read -r asset; do
              asset_name="$(jq -r '.name' <<<"$asset")"
              asset_url="$(jq -r '.url' <<<"$asset")"
              asset_size="$(jq -r '.size // 0' <<<"$asset")"

              if [ "$(basename "$asset_name")" != "$asset_name" ]; then
                continue
              fi

              gh api "$asset_url" -H "Accept: application/octet-stream" > "_site/downloads/$asset_name"
              test -s "_site/downloads/$asset_name"

              jq -n \
                --arg name "$asset_name" \
                --arg download_url "./downloads/$asset_name" \
                --argjson size "$asset_size" \
                '{name:$name,download_url:$download_url,size:$size}' >> /tmp/weibei-dmg-assets.jsonl
            done

          assets="$(jq -s '.' /tmp/weibei-dmg-assets.jsonl)"
          if [ "$(jq 'length' <<<"$assets")" -eq 0 ]; then
            echo '{"available":false}' > _site/release.json
            exit 0
          fi

          jq -n \
            --arg version "$tag" \
            --arg published_at "$published_at" \
            --argjson assets "$assets" \
            '{available:true,version:$version,published_at:$published_at,assets:$assets}' > _site/release.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
