name: Chat renderer lab (candidate qualification)

on:
  pull_request:
    paths:
      - 'Experiments/ChatRendererLab/**'
      - '.github/workflows/chat-renderer-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-renderer-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-macos:
    name: Candidate AppKit build and component checks
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build isolated Release app and verify bundled resources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Experiments/ChatRendererLab/.artifacts
          bash Experiments/ChatRendererLab/script/build_and_run.sh verify 2>&1 | tee Experiments/ChatRendererLab/.artifacts/run.log
      - name: Archive ad-hoc-signed lab app (not a release)
        if: success()
        run: |
          cd Experiments/ChatRendererLab/.artifacts
          ditto -c -k --sequesterRsrc --keepParent WeiBeiChatRendererLab.app WeiBeiChatRendererLab.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-renderer-lab-${{ runner.arch }}-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          path: |
            Experiments/ChatRendererLab/.artifacts/*.txt
            Experiments/ChatRendererLab/.artifacts/*.log
            Experiments/ChatRendererLab/.artifacts/*.json
            Experiments/ChatRendererLab/.artifacts/Package.resolved
            Experiments/ChatRendererLab/.artifacts/*.zip
            Experiments/ChatRendererLab/.artifacts/verification/**

  compatibility-macos:
    name: Verify candidate links with WeiBei dependency constraints
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve and link both renderer dependency families
        shell: bash
        run: |
          set -o pipefail
          cd Experiments/ChatRendererLab/Compatibility
          mkdir -p .artifacts
          swift package resolve 2>&1 | tee .artifacts/resolve.log
          cp Package.resolved .artifacts/Package.resolved
          swift package show-dependencies --format json > .artifacts/dependencies.json
          swift build -c release --product LinkedRenderersProbe 2>&1 | tee .artifacts/build.log
          # Link validation only: do not execute a raw SwiftPM GUI product.
      - name: Freeze reviewed list sources for the next integration step
        if: always()
        shell: bash
        run: |
          # Read-only source acquisition: no merging, rebasing or writes to #449.
          BASELINE=d457675fe1badcd56b4e7256223ef37282fcb9ac
          git fetch --no-tags --depth=1 origin "$BASELINE"
          mkdir -p Experiments/ChatRendererLab/Compatibility/.artifacts
          echo "$BASELINE" > Experiments/ChatRendererLab/Compatibility/.artifacts/list-baseline.txt
          python3 - "$BASELINE" <<'PY'
          import pathlib, subprocess, sys, zipfile
          ref = sys.argv[1]
          names = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', ref], text=True).splitlines()
          # Source text only: never archive fonts, user data, credentials or build caches.
          chosen = [n for n in names if n.endswith('.swift') and n.startswith(('Sources/WeiBei/', 'Sources/WeiBeiCore/', 'Tests/WeiBeiSafetyTests/'))]
          chosen += ['AGENTS.md', 'Package.swift', 'Package.resolved', 'script/native-bundle-resources.patch']
          output = pathlib.Path('Experiments/ChatRendererLab/Compatibility/.artifacts/list-baseline-sources.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in chosen:
                  archive.writestr(name, subprocess.check_output(['git', 'show', f'{ref}:{name}']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-link-compatibility-${{ runner.arch }}-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 7
          path: Experiments/ChatRendererLab/Compatibility/.artifacts/**
