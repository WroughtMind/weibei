name: Chat renderer lab (candidate qualification)

on:
  pull_request:
    paths:
      - 'Experiments/ChatRendererLab/**'
      - '.github/workflows/chat-renderer-lab.yml'
      - 'Sources/WeiBei/**'
      - 'Sources/WeiBeiCore/**'
      - 'Package.swift'
      - 'Package.resolved'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-renderer-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-macos:
    name: Candidate AppKit build and component checks
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build isolated Release app and verify bundled resources
        shell: bash
        run: |
          set -o pipefail
          mkdir -p Experiments/ChatRendererLab/.artifacts
          bash Experiments/ChatRendererLab/script/build_and_run.sh verify 2>&1 | tee Experiments/ChatRendererLab/.artifacts/run.log
      - name: Archive ad-hoc-signed lab app (not a release)
        if: success()
        run: |
          cd Experiments/ChatRendererLab/.artifacts
          ditto -c -k --sequesterRsrc --keepParent WeiBeiChatRendererLab.app WeiBeiChatRendererLab.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-renderer-lab-${{ runner.arch }}-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          path: |
            Experiments/ChatRendererLab/.artifacts/*.txt
            Experiments/ChatRendererLab/.artifacts/*.log
            Experiments/ChatRendererLab/.artifacts/*.json
            Experiments/ChatRendererLab/.artifacts/Package.resolved
            Experiments/ChatRendererLab/.artifacts/*.zip
            Experiments/ChatRendererLab/.artifacts/verification/**

  compatibility-macos:
    name: Verify candidate links with WeiBei dependency constraints
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve and link both renderer dependency families
        shell: bash
        run: |
          set -o pipefail
          cd Experiments/ChatRendererLab/Compatibility
          mkdir -p .artifacts
          swift package resolve 2>&1 | tee .artifacts/resolve.log
          python3 ../script/prepare_app_resources.py .build/checkouts
          cp Package.resolved .artifacts/Package.resolved
          swift package show-dependencies --format json > .artifacts/dependencies.json
          swift build -c release --product LinkedRenderersProbe 2>&1 | tee .artifacts/build.log
          # Link validation only: do not execute a raw SwiftPM GUI product.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-link-compatibility-${{ runner.arch }}-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 7
          path: Experiments/ChatRendererLab/Compatibility/.artifacts/**

  conversation-macos:
    name: Independent real conversation Release candidate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and verify the real conversation candidate
        run: bash Experiments/ChatRendererLab/script/build_conversation.sh verify
      - name: Open the normal conversation window on the isolated CI desktop
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('Experiments/ChatRendererLab/.artifacts/conversation-candidate').resolve()
          output = root / 'normal-window'
          output.mkdir()
          try:
              subprocess.run(['/usr/bin/open', '-n', '-g', '-W', '--stdout', str(output / 'stdout.log'),
                              '--stderr', str(output / 'stderr.log'), str(root / '魏碑-会话实验-451.app'),
                              '--args', '--chat-renderer-smoke', str(output)], check=True, timeout=90)
          except subprocess.TimeoutExpired:
              report = json.loads((output / 'normal-window.json').read_text())
              subprocess.run(['/usr/bin/sample', str(report['process_id']), '3', '-file',
                              str(output / 'termination-sample.log')], timeout=10)
              raise
          report = json.loads((output / 'normal-window.json').read_text())
          assert report['normal_entry'] and report['visible_body_characters'] > 0, report
          print(report)
          PY
      - name: Archive independent candidate
        if: success()
        run: |
          cd Experiments/ChatRendererLab/.artifacts/conversation-candidate
          ditto -c -k --sequesterRsrc --keepParent '魏碑-会话实验-451.app' '魏碑-会话实验-451.zip'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-451-${{ runner.arch }}-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 14
          path: |
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/*.txt
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/*.log
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/*.zip
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/Package.resolved
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/check-*/*.json
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/check-*/*.log
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/normal-window/*.json
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/normal-window/*.log
            Experiments/ChatRendererLab/.artifacts/conversation-candidate/normal-window/*.png
