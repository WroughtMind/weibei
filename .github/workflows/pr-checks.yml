name: 魏碑合并请求检查

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: "明确阶段整合或最终候选版：运行全部专项与安装包追溯"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    name: 快速编译与核心自检
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      release: ${{ steps.scope.outputs.release }}
      windows: ${{ steps.scope.outputs.windows }}

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 判断本次风险范围
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./script/ci_changed_scopes.sh --self-check
          base="$PUSH_BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA")"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          scopes="$(./script/ci_changed_scopes.sh "$base" "$HEAD_SHA")"
          printf '%s\n' "$scopes"
          printf '%s\n' "$scopes" >> "$GITHUB_OUTPUT"

      - name: 记录构建工具链
        run: |
          swift --version
          xcodebuild -version

      - name: 编译
        if: github.event_name != 'pull_request' || steps.scope.outputs.code == 'true'
        run: swift build

      - name: 运行应用自检
        if: github.event_name != 'pull_request' || steps.scope.outputs.code == 'true'
        run: swift run WeiBeiSelfCheck

      - name: 运行开发工具子命令自检
        if: github.event_name != 'pull_request' || steps.scope.outputs.code == 'true'
        run: |
          swift run WeiBeiDev selfcheck-assertions
          swift run WeiBeiDev nslog-scan

      - name: 安装 Node 依赖
        if: (github.event_name == 'pull_request' && (steps.scope.outputs.agent == 'true' || steps.scope.outputs.editor == 'true' || steps.scope.outputs.tools == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        run: npm ci --workspaces=false

      - name: 运行 Node 工具脚本类型检查
        if: (github.event_name == 'pull_request' && steps.scope.outputs.tools == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        run: npm run typecheck:tools

      - name: 运行编辑器自检
        if: (github.event_name == 'pull_request' && steps.scope.outputs.editor == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        run: |
          npm run typecheck:editor
          npm run test:editor
          npm run build:editor
          git diff --exit-code -- Sources/WeiBei/Resources/Editor
          swift run WeiBeiWebEditorCheck

      - name: 运行课程目录、数据与 Agent 安全自检
        if: (github.event_name == 'pull_request' && (steps.scope.outputs.data_safety == 'true' || steps.scope.outputs.agent == 'true')) || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        run: stdbuf -oL -eL swift test --filter WeiBeiSafetyTests

      - name: 检查空白与生成文件
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  windows-candidate:
    name: Windows 编译、冒烟与候选包
    needs: fast-check
    if: ${{ needs.fast-check.result == 'success' && (needs.fast-check.outputs.windows == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)) }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 固定 Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装 Windows 与共享依赖
        run: npm ci --workspace @weibei/windows --include-workspace-root

      - name: 记录 Windows 工具链
        shell: pwsh
        run: |
          node --version
          npm --version
          npm exec --workspace @weibei/windows -- electron --version

      - name: 运行共享编辑器检查
        run: |
          npm run typecheck:tools
          npm run typecheck:editor
          npm run test:editor
          npm run build:editor
          git diff --exit-code -- Sources/WeiBei/Resources/Editor

      - name: 运行 Windows 类型与单元检查
        run: |
          npm run typecheck:windows
          npm run test:windows

      - name: 检查 Windows 验证脚本自身
        shell: pwsh
        run: |
          ./script/windows/verify-package.ps1 -SelfCheck
          ./script/windows/smoke-package.ps1 -SelfCheck

      - name: 构建 Windows 应用与 NSIS / Portable 候选包
        shell: pwsh
        run: |
          npm run rebuild:native --workspace @weibei/windows
          npm run build:windows
          npm exec --workspace @weibei/windows -- electron-builder --win nsis portable --x64 --publish never

      - name: 发现可用的打包后 UI 检查
        id: ui-checks
        shell: pwsh
        run: |
          $package = Get-Content "windows/package.json" -Raw | ConvertFrom-Json
          $smoke = $package.scripts.PSObject.Properties["test:smoke"]
          $visual = $package.scripts.PSObject.Properties["test:visual"]
          $smokeValue = if ($null -ne $smoke) { "true" } else { "false" }
          $visualValue = if ($null -ne $visual) { "true" } else { "false" }
          "smoke=$smokeValue" >> $env:GITHUB_OUTPUT
          "visual=$visualValue" >> $env:GITHUB_OUTPUT
          if ($null -eq $smoke) { Write-Host "test:smoke 尚未接入；安装包 PowerShell 冒烟仍会运行。" }
          if ($null -eq $visual) { Write-Host "test:visual 尚未接入；基线建立后 CI 会自动启用。" }

      - name: 运行 Playwright 打包后冒烟
        if: steps.ui-checks.outputs.smoke == 'true'
        run: npm run test:smoke --workspace @weibei/windows

      - name: 运行 Playwright 截图回归
        if: steps.ui-checks.outputs.visual == 'true'
        run: npm run test:visual --workspace @weibei/windows

      - name: 校验包内容、版本、原生模块与哈希
        shell: pwsh
        run: ./script/windows/verify-package.ps1

      - name: 验证 NSIS 安装、同版覆盖、卸载与 Portable
        shell: pwsh
        run: ./script/windows/smoke-package.ps1

      - name: 检查空白、生成文件与工作树
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code
          if (git status --porcelain=v1) {
            git status --short
            throw "Windows 构建后工作树不干净"
          }

      - name: 保留 Windows 失败证据
        if: failure() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WeiBei-Windows-${{ github.sha }}-diagnostics
          path: |
            windows/test-results/
            windows/playwright-report/
            windows/release/*.sha256
          retention-days: 3
          if-no-files-found: ignore

      - name: 保留短期 Windows 候选包
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WeiBei-Windows-x64-${{ github.sha }}-验收包
          path: |
            windows/release/*-Setup.exe
            windows/release/*-Portable.exe
            windows/release/*.sha256
            windows/test-results/**/evidence/*.png
          retention-days: 1
          if-no-files-found: error

  release-package:
    name: 完整候选构建与安装包追溯
    needs: fast-check
    if: ${{ needs.fast-check.result == 'success' && ((github.event_name == 'pull_request' && needs.fast-check.outputs.release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite)) }}
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 安装 Node 依赖（package 前置）
        run: npm ci --workspaces=false

      - name: 生成可追溯安装包
        run: ./script/build_and_run.sh package

      - name: 校验版本、构建号与提交来源
        run: swift run WeiBeiDev verify-release-metadata --require-clean

      - name: 校验安装包签名
        run: /usr/bin/codesign --verify --deep --strict "dist/魏碑.app"

      - name: 确认正式包不含测试支架或内置示例
        run: swift run WeiBeiDev verify-production-hygiene "dist/魏碑.app"

      - name: 压缩短期真实窗口验收包
        run: ditto -c -k --sequesterRsrc --keepParent "dist/魏碑.app" "dist/魏碑-CI验收包.zip"

      - name: 保留短期真实窗口验收包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 魏碑-${{ github.sha }}-真实窗口验收包
          path: dist/魏碑-CI验收包.zip
          retention-days: 1
          if-no-files-found: error
