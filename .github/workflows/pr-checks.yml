name: Temporary PR485 whiteboard diagnostics (not full acceptance)

# Temporary branch-only use of the already registered workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr485-whiteboard-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  whiteboard-diagnostic:
    name: Whiteboard fixture diagnostics only
    runs-on: macos-26
    timeout-minutes: 30
    env:
      WEIBEI_WHITEBOARD_DIAGNOSTIC_DIR: .build/whiteboard-diagnostic-evidence
    steps:
      - name: Check out diagnostic commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Record exact source and toolchain
        shell: bash
        run: |
          mkdir -p "$WEIBEI_WHITEBOARD_DIAGNOSTIC_DIR"
          {
            printf 'purpose=whiteboard-fixture-diagnostics-only; not full acceptance\n'
            printf 'source='; git rev-parse HEAD
            printf 'parent='; git rev-parse HEAD^
            git status --porcelain=v1
            uname -a
            swift --version
            xcodebuild -version
          } 2>&1 | tee "$WEIBEI_WHITEBOARD_DIAGNOSTIC_DIR/environment.log"

      - name: Run existing whiteboard WebKit fixture with diagnostics
        shell: bash
        run: |
          set +e
          swift run WeiBeiWebEditorCheck --whiteboard \
            > >(tee "$WEIBEI_WHITEBOARD_DIAGNOSTIC_DIR/stdout.log") \
            2> >(tee "$WEIBEI_WHITEBOARD_DIAGNOSTIC_DIR/stderr.log" >&2)
          status=$?
          wait
          printf '%s\n' "$status" > "$WEIBEI_WHITEBOARD_DIAGNOSTIC_DIR/exit-code.txt"
          exit "$status"

      - name: Retain synthetic diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whiteboard-diagnostic-${{ github.sha }}
          path: ${{ env.WEIBEI_WHITEBOARD_DIAGNOSTIC_DIR }}
          retention-days: 2
          if-no-files-found: error
