name: 魏碑合并请求检查

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: "明确阶段整合或最终候选版：运行全部专项与安装包追溯"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: 判断改动范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      release: ${{ steps.scope.outputs.release }}
      agent: ${{ steps.scope.outputs.agent }}
      editor: ${{ steps.scope.outputs.editor }}
      data_safety: ${{ steps.scope.outputs.data_safety }}
      tools: ${{ steps.scope.outputs.tools }}
      website: ${{ steps.scope.outputs.website }}

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 判断本次风险范围
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./script/ci_changed_scopes.sh --self-check
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA")"
          else
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          scopes="$(./script/ci_changed_scopes.sh "$base" "$HEAD_SHA")"
          printf '%s\n' "$scopes"
          printf '%s\n' "$scopes" >> "$GITHUB_OUTPUT"

      - name: 验证工作流触发范围
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 script/check_ci_routing.py
          for file in script/*.sh DesignSystem/scripts/*.sh; do bash -n "$file"; done

  website-check:
    name: 官网检查
    needs: scope
    if: needs.scope.outputs.website == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 取出源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 检查并组装官网
        id: website
        run: bash script/check_website.sh

  tools-check:
    name: 工具脚本检查
    needs: scope
    if: needs.scope.outputs.tools == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 安装工具依赖
        id: dependencies
        run: npm ci
      - name: 工具类型检查与行为测试
        id: tools
        run: |
          npm run typecheck:tools
          npm run test:release-tools

  app-check:
    name: 应用编译与相关自检
    needs: scope
    if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.code == 'true' || needs.scope.outputs.agent == 'true' || needs.scope.outputs.editor == 'true' || needs.scope.outputs.data_safety == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: 取出源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 记录构建工具链
        run: |
          swift --version
          xcodebuild -version

      - name: 编译
        id: compile
        if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.code == 'true'
        run: |
          swift package resolve
          python3 Experiments/ChatRendererLab/script/prepare_app_resources.py .build/checkouts
          swift build

      - name: 运行应用自检
        id: core
        if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.code == 'true'
        run: swift run WeiBeiSelfCheck

      - name: 运行开发工具子命令自检
        id: dev
        if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.code == 'true'
        run: |
          swift run WeiBeiDev nslog-scan

      - name: 安装 Node 依赖
        id: dependencies
        if: needs.scope.outputs.editor == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        run: npm ci

      - name: 运行编辑器自检
        id: editor
        if: needs.scope.outputs.editor == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        run: |
          npm run typecheck:editor
          npm run test:editor
          npm run build:editor
          git diff --exit-code -- Sources/WeiBei/Resources/Editor
          swift run WeiBeiWebEditorCheck

      - name: 运行课程目录、数据与 Agent 安全自检
        id: safety
        if: (needs.scope.outputs.data_safety == 'true' || needs.scope.outputs.agent == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite)
        run: stdbuf -oL -eL swift test --filter WeiBeiSafetyTests

      - name: 检查空白与生成文件
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

  release-package:
    name: 完整候选构建与安装包追溯
    needs: [scope, app-check]
    if: ${{ !cancelled() && needs.scope.result == 'success' && (needs.app-check.result == 'success' || needs.app-check.result == 'skipped') && ((github.event_name == 'pull_request' && needs.scope.outputs.release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite)) }}
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 安装 Node 依赖（package 前置）
        id: dependencies
        run: npm ci

      - name: 生成、启动并挂载验收 Apple Silicon DMG
        id: package
        env:
          WEIBEI_TARGET_ARCH: arm64
          WEIBEI_VERIFY_LAUNCH: "1"
        run: ./script/build_release_dmg.sh --arch arm64

      - name: 校验版本、构建号与提交来源
        run: swift run WeiBeiDev verify-release-metadata --require-clean

      - name: 校验 Apple Silicon 二进制架构与更新源
        run: swift run WeiBeiDev verify-release-architecture arm64 "dist/魏碑.app"

      - name: 校验安装包签名
        run: /usr/bin/codesign --verify --deep --strict "dist/魏碑.app"

      - name: 确认正式包不含测试支架或内置示例
        run: swift run WeiBeiDev verify-production-hygiene "dist/魏碑.app"

      - name: 压缩短期真实窗口验收包
        run: ditto -c -k --sequesterRsrc --keepParent "dist/魏碑.app" "dist/魏碑-CI验收包.zip"

      - name: 保留短期真实窗口验收包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 魏碑-${{ github.sha }}-真实窗口验收包
          path: |
            dist/魏碑-CI验收包.zip
            dist/release/arm64/WeiBei-*-macOS-arm64.dmg
            dist/release/arm64/WeiBei-*-macOS-arm64.dmg.sha256
          retention-days: 1
          if-no-files-found: error

  intel-check:
    name: Intel 编译、启动与安装包追溯
    needs: scope
    if: github.event_name == 'workflow_dispatch' || needs.scope.outputs.code == 'true' || needs.scope.outputs.release == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 60

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 记录 Intel 构建工具链
        run: |
          test "$(uname -m)" = "x86_64"
          swift --version
          xcodebuild -version

      - name: Intel 原生编译与核心自检
        id: core
        if: ${{ github.event_name == 'workflow_dispatch' || needs.scope.outputs.code == 'true' }}
        run: |
          swift package resolve
          python3 Experiments/ChatRendererLab/script/prepare_app_resources.py .build/checkouts
          swift build
          swift run WeiBeiSelfCheck
          swift run WeiBeiDev nslog-scan

      - name: 安装安装包前置依赖
        id: dependencies
        if: ${{ (github.event_name == 'pull_request' && needs.scope.outputs.release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite) }}
        run: npm ci

      - name: Intel 打包、启动并挂载验收 DMG
        id: package
        if: ${{ (github.event_name == 'pull_request' && needs.scope.outputs.release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite) }}
        env:
          WEIBEI_TARGET_ARCH: x86_64
          WEIBEI_VERIFY_LAUNCH: "1"
        run: ./script/build_release_dmg.sh --arch x86_64

      - name: 校验 Intel 包身份、架构与签名
        if: ${{ (github.event_name == 'pull_request' && needs.scope.outputs.release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite) }}
        run: |
          swift run WeiBeiDev verify-release-metadata --require-clean
          swift run WeiBeiDev verify-release-architecture x86_64 "dist/魏碑.app"
          /usr/bin/codesign --verify --deep --strict "dist/魏碑.app"
          swift run WeiBeiDev verify-production-hygiene "dist/魏碑.app"

      - name: 压缩短期 Intel 真实窗口验收包
        if: ${{ (github.event_name == 'pull_request' && needs.scope.outputs.release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite) }}
        run: ditto -c -k --sequesterRsrc --keepParent "dist/魏碑.app" "dist/魏碑-Intel-CI验收包.zip"

      - name: 保留短期 Intel 真实窗口验收包
        if: ${{ (github.event_name == 'pull_request' && needs.scope.outputs.release == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full_suite) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 魏碑-${{ github.sha }}-Intel-真实窗口验收包
          path: |
            dist/魏碑-Intel-CI验收包.zip
            dist/release/x86_64/WeiBei-*-macOS-x86_64.dmg
            dist/release/x86_64/WeiBei-*-macOS-x86_64.dmg.sha256
          retention-days: 1
          if-no-files-found: error

  # 保留分支保护要求的名称；分类失败或应用检查失败不能被跳过伪装成成功。
  fast-check:
    # 手动局部检查不能以同名结果覆盖 PR 的必需合并检查。
    name: ${{ github.event_name == 'pull_request' && '快速编译与核心自检' || '手动检查汇总' }}
    needs: [scope, website-check, tools-check, app-check, release-package, intel-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总相关检查结果
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_SUITE: ${{ inputs.full_suite || false }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['scope']['result'] == 'success', '改动范围判断未通过'
          scopes = results['scope']['outputs']
          manual = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          full = manual and os.environ['FULL_SUITE'] == 'true'
          enabled = lambda key: scopes[key] == 'true'
          required = {
              'website-check': enabled('website') or full,
              'tools-check': enabled('tools') or full,
              'app-check': manual or any(enabled(k) for k in ('code', 'agent', 'editor', 'data_safety')),
              'intel-check': manual or enabled('code') or enabled('release'),
              'release-package': (not manual and enabled('release')) or full,
          }
          for name, needed in required.items():
              allowed = ('success',) if needed else ('success', 'skipped')
              assert results[name]['result'] in allowed, f"{name}: {results[name]['result']}"
          PYTHON
