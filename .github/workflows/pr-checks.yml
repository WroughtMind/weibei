name: Temporary PR518 host safety verification (not full matrix)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr518-host-fixture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host-safety:
    name: Full host safety suite and native eval with explicit fixture locale
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out exact fixture candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record source and toolchain
        run: |
          mkdir -p .build/host-fixture-evidence
          { git rev-parse HEAD; git rev-parse HEAD^; git status --porcelain=v1; swift --version; xcodebuild -version; } | tee .build/host-fixture-evidence/environment.log
      - name: Run every existing safety test without dropping assertions
        shell: bash
        run: |
          set +e
          swift test --filter WeiBeiSafetyTests 2>&1 | tee .build/host-fixture-evidence/safety.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > .build/host-fixture-evidence/safety-exit-code.txt
          exit "$status"
      - name: Run existing native eval self check
        if: always()
        shell: bash
        run: |
          set +e
          WEIBEI_NATIVE_EVAL_EFFORT=high swift run WeiBeiNativeCheck --native-eval-self-check 2>&1 | tee .build/host-fixture-evidence/native-eval.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > .build/host-fixture-evidence/native-eval-exit-code.txt
          exit "$status"
      - name: Keep synthetic host evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-fixture-${{ github.sha }}
          path: .build/host-fixture-evidence
          retention-days: 2
          if-no-files-found: error
