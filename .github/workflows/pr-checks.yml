name: 魏碑合并请求检查

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-check-package:
    name: 编译、自检与安装包追溯
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 记录构建工具链
        run: |
          swift --version
          xcodebuild -version

      - name: 准备 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.3
          cache: npm

      - name: 记录 Node.js 工具链
        run: |
          node --version
          npm --version

      - name: 运行项目检查
        run: make check

      - name: 生成可追溯安装包
        run: make package

      - name: 校验版本、构建号与提交来源
        run: ./script/verify_release_metadata.sh --require-clean

      - name: 校验安装包签名
        run: /usr/bin/codesign --verify --deep --strict "dist/魏碑.app"

      - name: 压缩短期真实窗口验收包
        run: ditto -c -k --sequesterRsrc --keepParent "dist/魏碑.app" "dist/魏碑-CI验收包.zip"

      - name: 保留短期真实窗口验收包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 魏碑-${{ github.sha }}-真实窗口验收包
          path: dist/魏碑-CI验收包.zip
          retention-days: 1
          if-no-files-found: error
