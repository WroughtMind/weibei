name: 魏碑合并请求检查

on:
  pull_request:
    branches:
      - codex/course-workspace
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-resources:
    name: Web 类型与生成物漂移
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: 取出源码
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装编辑器依赖
        run: npm ci

      - name: 安装 Rich Answer 运行时依赖
        run: npm ci --prefix Prototypes/RichAnswerWebRuntime

      - name: 运行 Web 类型、测试与生成物检查
        run: npm run check

      - name: 复核临时目录生成物
        run: ./script/check-generated-resources.sh

      - name: 检查品牌资产
        run: ./DesignSystem/scripts/verify-assets.sh

  build-check-package:
    name: 编译、自检与安装包追溯
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: 取出完整源码历史
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 记录构建工具链
        run: |
          swift --version
          xcodebuild -version

      - name: 运行 Swift 行为测试
        run: swift test

      - name: 运行完整检查入口
        run: ./script/build_and_run.sh check

      - name: 运行 Pi 终止语义自检
        run: WEIBEI_PI_TERMINAL_SELF_CHECK_ONLY=1 swift run WeiBeiSelfCheck

      - name: 生成可追溯安装包
        run: ./script/build_and_run.sh package

      - name: 校验版本、构建号与提交来源
        run: ./script/verify_release_metadata.sh --require-clean

      - name: 校验安装包签名
        run: /usr/bin/codesign --verify --deep --strict "dist/魏碑.app"

      - name: 压缩短期真实窗口验收包
        run: ditto -c -k --sequesterRsrc --keepParent "dist/魏碑.app" "dist/魏碑-CI验收包.zip"

      - name: 保留短期真实窗口验收包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 魏碑-${{ github.sha }}-真实窗口验收包
          path: dist/魏碑-CI验收包.zip
          retention-days: 1
          if-no-files-found: error
