name: Verify Course Space course-local map fix

on:
  push:
    branches:
      - codex/course-space-doc-note-redesign
    paths:
      - .github/codex-course-space-scope-fix.patch.gz
      - .github/workflows/codex-course-space-scope-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: macos-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/course-space-doc-note-redesign

      - name: Apply course-local map behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          paper = "Sources/WeiBei/Views/CourseRelationPaperView.swift"
          replace_once(
              paper,
              "    let isCompact: Bool\n\n    @State private var scope: CourseRelationPaperScope?",
              "    let isCompact: Bool\n    let allowsWorkspaceScopes: Bool = true\n\n    @State private var scope: CourseRelationPaperScope?",
          )
          replace_once(
              paper,
              "    private var effectiveScope: CourseRelationPaperScope {\n        let candidate = scope ?? defaultScope",
              "    private var effectiveScope: CourseRelationPaperScope {\n        if !allowsWorkspaceScopes,\n           let courseID = store.courseWorkspaceCourseID,\n           store.courses.contains(where: { $0.id == courseID }) {\n            return .course(courseID)\n        }\n\n        let candidate = scope ?? defaultScope",
          )
          replace_once(
              paper,
              "                let showCourseRail = !isCompact && proxy.size.width >= 760",
              "                let showCourseRail = allowsWorkspaceScopes\n                    && !isCompact\n                    && proxy.size.width >= 760",
          )
          replace_once(
              paper,
              "        .onChange(of: store.courseWorkspaceCourseID) { _, newID in\n            // Follow course switches from the title menu unless user picked a non-course filter.",
              "        .onChange(of: store.courseWorkspaceCourseID) { _, newID in\n            if !allowsWorkspaceScopes {\n                if let newID,\n                   store.courses.contains(where: { $0.id == newID }) {\n                    scope = .course(newID)\n                }\n                return\n            }\n\n            // Follow course switches from the title menu unless user picked a non-course filter.",
          )
          replace_once(
              paper,
              "            if isCompact {\n                scopeMenu",
              "            if isCompact && allowsWorkspaceScopes {\n                scopeMenu",
          )

          workspace = "Sources/WeiBei/Views/CourseDocNoteWorkspaceView.swift"
          replace_once(
              workspace,
              '''        } else {
            CourseRelationPaperView(
                lens: $lens,
                search: search,
                selectedNoteID: $selectedNoteID,
                selectedMaterialID: $selectedMaterialID,
                isCompact: isCompact
            )
        }
''',
              '''        } else if explicitLinkCount == 0 {
            VStack(spacing: 18) {
                CourseEmptyState(
                    title: store.ui(
                        "还没有文稿与笔记的明确关联",
                        "No explicit doc–note links yet"
                    ),
                    detail: store.ui(
                        "先回到列表，选择一份文稿，再勾选相关笔记。关系图只展示真实保存的关联。",
                        "Return to List, select a doc, and check its related notes. The map only shows saved links."
                    ),
                    systemImage: "point.3.connected.trianglepath.dotted"
                )

                Button(store.ui("返回列表建立关联", "Link in List")) {
                    withAnimation(WeiBeiMotion.panel) {
                        presentation = .list
                    }
                }
                .buttonStyle(WeiBeiTextActionButtonStyle(active: true))
            }
            .frame(maxWidth: 460)
            .frame(maxWidth: .infinity, maxHeight: .infinity)
            .padding(32)
        } else {
            CourseRelationPaperView(
                lens: $lens,
                search: search,
                selectedNoteID: $selectedNoteID,
                selectedMaterialID: $selectedMaterialID,
                isCompact: isCompact,
                allowsWorkspaceScopes: false
            )
        }
''',
          )
          PY

      - name: Parse changed Swift files
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse Sources/WeiBei/Views/CourseRelationPaperView.swift
          swiftc -frontend -parse Sources/WeiBei/Views/CourseDocNoteWorkspaceView.swift

      - name: Build Weibei
        shell: bash
        run: |
          set -euo pipefail
          swift build

      - name: Run focused regression test
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter CourseWorkspaceSummaryTests

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/codex-course-space-scope-fix.patch.gz
          rm -f .github/workflows/codex-course-space-scope-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep Course Space Doc Note map course-local"
          git push origin HEAD:codex/course-space-doc-note-redesign
