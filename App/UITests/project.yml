name: WeiBeiOnboardingUI
options:
  minimumXcodeGenVersion: '2.45.0'
  projectFormat: xcode15_0
  xcodeVersion: '15.4'
targets:
  WeiBeiOnboardingUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '14.0'
    sources: [OnboardingUITests.swift, ReleasedAppCompatibilityUITests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changfenhuang.weibei.OnboardingUITests
        SWIFT_VERSION: '5.0'
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
    info:
      path: Info.plist
      properties:
        WeiBeiCheckAppPath: $(WEIBEI_CHECK_APP_PATH)
        WeiBeiCIExternalPromptHandling: $(WEIBEI_CI_EXTERNAL_PROMPT_HANDLING)
    scheme:
      testTargets: [WeiBeiOnboardingUITests]
