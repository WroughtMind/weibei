name: WeiBeiOnboardingUI
targets:
  WeiBeiOnboardingUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: '14.0'
    sources: [OnboardingUITests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.changfenhuang.weibei.OnboardingUITests
        SWIFT_VERSION: '5.0'
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
    info:
      path: Info.plist
      properties:
        WeiBeiCheckAppPath: $(WEIBEI_CHECK_APP_PATH)
        WeiBeiCheckSupportPath: $(WEIBEI_CHECK_SUPPORT_PATH)
    scheme:
      testTargets: [WeiBeiOnboardingUITests]
