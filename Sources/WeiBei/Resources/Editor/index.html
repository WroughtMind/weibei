<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>魏碑笔记</title>
  <link rel="stylesheet" href="./editor.css">
  <style>
    :root,
    :root[data-weibei-theme="paper"] {
      color-scheme: light;
      --paper: #f4ead5;
      --paper-raised: #f9f1de;
      --ink: #1d1814;
      --muted: rgba(58, 46, 38, .72);
      --faint: rgba(58, 46, 38, .50);
      --line: rgba(92, 70, 46, .28);
      --cinnabar: #91261c;
      --cinnabar-soft: rgba(145, 38, 28, .10);
      --cinnabar-line: rgba(145, 38, 28, .26);
      --ochre: #77582f;
      --moss: #395f48;
      --blue-ink: #31566b;
      --violet-ink: #5d4b6d;
      --code: rgba(29, 24, 20, .06);
      --code-paper: rgba(29, 24, 20, .052);
      --selection: rgba(145, 38, 28, .18);
    }

    :root[data-weibei-theme="inkstone"] {
      color-scheme: dark;
      --paper: #0f0f0f;
      --paper-raised: #151515;
      --ink: #d7cbb0;
      --muted: rgba(155, 145, 120, .88);
      --faint: rgba(111, 102, 85, .86);
      --line: #2d2d2d;
      --cinnabar: #a6362b;
      --cinnabar-soft: rgba(92, 38, 33, .62);
      --cinnabar-line: rgba(166, 54, 43, .45);
      --ochre: #8b5e3c;
      --moss: #b88a42;
      --blue-ink: #c8b98a;
      --violet-ink: #b99b72;
      --code: rgba(255, 255, 255, .05);
      --code-paper: #171717;
      --selection: rgba(166, 54, 43, .35);
    }

    :root[data-weibei-theme="xuan"] {
      color-scheme: light;
      --paper: #f8f5f0;
      --paper-raised: #fdfcf9;
      --ink: #25231f;
      --muted: rgba(90, 86, 78, .74);
      --faint: rgba(90, 86, 78, .52);
      --line: rgba(110, 104, 92, .22);
      --cinnabar: #8a2f24;
      --cinnabar-soft: rgba(138, 47, 36, .09);
      --cinnabar-line: rgba(138, 47, 36, .24);
      --ochre: #6e634f;
      --moss: #3f614c;
      --blue-ink: #335266;
      --violet-ink: #5a4d64;
      --code: rgba(37, 35, 31, .05);
      --code-paper: rgba(37, 35, 31, .045);
      --selection: rgba(138, 47, 36, .16);
    }

    :root[data-weibei-theme="stele"] {
      color-scheme: dark;
      --paper: #16181c;
      --paper-raised: #1e2228;
      --ink: #d2d6dc;
      --muted: rgba(154, 161, 171, .88);
      --faint: rgba(110, 118, 130, .86);
      --line: #3a414c;
      --cinnabar: #b04034;
      --cinnabar-soft: rgba(90, 42, 40, .58);
      --cinnabar-line: rgba(176, 64, 52, .45);
      --ochre: #8a7a5c;
      --moss: #8fa06a;
      --blue-ink: #b8c4d0;
      --violet-ink: #a8b0c0;
      --code: rgba(255, 255, 255, .05);
      --code-paper: #1a1e24;
      --selection: rgba(176, 64, 52, .32);
    }

    :root {
      --floating-surface: color-mix(in srgb, var(--paper-raised) 96%, transparent);
      --floating-line: var(--line);
      --floating-ink: var(--ink);
      --floating-muted: var(--muted);
      --floating-faint: var(--faint);
      --floating-accent: var(--cinnabar);
      --floating-accent-soft: var(--cinnabar-soft);
      --floating-accent-line: var(--cinnabar-line);
      --floating-input: rgba(255, 255, 255, .18);
      --floating-input-focus: var(--paper-raised);
      --floating-menu-shadow: 0 14px 34px rgba(35, 26, 19, .18), 0 2px 8px rgba(35, 26, 19, .10);
      --floating-toolbar-shadow: 0 6px 18px rgba(35, 26, 19, .12);
      /* Single quiet-but-legible tint shared by half-typed and revealed Markdown markers. */
      --weibei-syntax: var(--blue-ink);
      --weibei-syntax-mark: var(--blue-ink);
    }

    :root[data-weibei-glass="glassLight"] {
      --floating-surface: rgba(240, 248, 255, .78);
      --floating-line: rgba(71, 89, 112, .24);
      --floating-ink: #171d26;
      --floating-muted: rgba(70, 80, 94, .92);
      --floating-faint: rgba(110, 122, 140, .82);
      --floating-accent: #9c281d;
      --floating-accent-soft: rgba(156, 40, 29, .11);
      --floating-accent-line: rgba(156, 40, 29, .28);
      --floating-input: rgba(255, 255, 255, .30);
      --floating-input-focus: rgba(248, 252, 255, .88);
      --floating-menu-shadow: 0 14px 34px rgba(37, 55, 76, .14), 0 2px 8px rgba(37, 55, 76, .08);
      --floating-toolbar-shadow: 0 6px 18px rgba(37, 55, 76, .10);
    }

    :root[data-weibei-glass="glassDark"] {
      --floating-surface: rgba(13, 20, 31, .78);
      --floating-line: rgba(201, 219, 242, .18);
      --floating-ink: #e8eff9;
      --floating-muted: rgba(173, 186, 204, .94);
      --floating-faint: rgba(122, 140, 163, .86);
      --floating-accent: #eb5746;
      --floating-accent-soft: rgba(158, 48, 42, .42);
      --floating-accent-line: rgba(235, 87, 70, .46);
      --floating-input: rgba(255, 255, 255, .08);
      --floating-input-focus: rgba(31, 43, 61, .92);
      --floating-menu-shadow: 0 16px 38px rgba(0, 0, 0, .34), 0 2px 8px rgba(0, 0, 0, .24);
      --floating-toolbar-shadow: 0 7px 20px rgba(0, 0, 0, .26);
    }

    :root[data-weibei-glass="glassMist"] {
      --floating-surface: rgba(244, 249, 255, .72);
      --floating-line: rgba(70, 91, 116, .18);
      --floating-ink: #25231f;
      --floating-muted: rgba(90, 86, 78, .74);
      --floating-faint: rgba(90, 86, 78, .52);
      --floating-accent: #8a2f24;
      --floating-accent-soft: rgba(138, 47, 36, .09);
      --floating-accent-line: rgba(138, 47, 36, .24);
      --floating-input: rgba(255, 255, 255, .18);
      --floating-input-focus: #fdfcf9;
      --floating-menu-shadow: 0 14px 34px rgba(35, 26, 19, .18), 0 2px 8px rgba(35, 26, 19, .10);
      --floating-toolbar-shadow: 0 6px 18px rgba(35, 26, 19, .12);
    }

    :root[data-weibei-glass="glassSlate"] {
      --floating-surface: rgba(27, 33, 43, .66);
      --floating-line: rgba(185, 198, 216, .14);
      --floating-ink: #d2d6dc;
      --floating-muted: rgba(154, 161, 171, .88);
      --floating-faint: rgba(110, 118, 130, .86);
      --floating-accent: #b04034;
      --floating-accent-soft: rgba(90, 42, 40, .58);
      --floating-accent-line: rgba(176, 64, 52, .45);
      --floating-input: rgba(255, 255, 255, .18);
      --floating-input-focus: #1e2228;
      --floating-menu-shadow: 0 14px 34px rgba(35, 26, 19, .18), 0 2px 8px rgba(35, 26, 19, .10);
      --floating-toolbar-shadow: 0 6px 18px rgba(35, 26, 19, .12);
    }

    @font-face {
      font-family: "WeiBei Stele";
      src: url("../Fonts/WeiBeiStele.ttf") format("truetype");
      font-display: swap;
    }

    :root { --weibei-writing-font: "Songti SC", "STSong", ui-serif, serif; }

    [data-weibei-font="system"] { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif; }
    [data-weibei-font="serif"] { font-family: "Songti SC", "STSong", ui-serif, serif; }
    [data-weibei-font="literary"] { font-family: "WeiBei Stele", "Kaiti SC", "STKaiti", ui-serif, serif; }

    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: var(--weibei-writing-font);
    }

    body {
      overflow: hidden;
    }

    :root[data-weibei-compact-preview="true"] html,
    :root[data-weibei-compact-preview="true"] body {
      background: transparent;
    }

    #editor {
      box-sizing: border-box;
      height: 100vh;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      padding: 28px 34px 64px;
      background: transparent;
    }

    :root[data-weibei-compact-preview="true"] #editor {
      height: auto;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      background: transparent;
    }

    :root[data-weibei-compact-preview="true"][data-weibei-theme="inkstone"] #editor,
    :root[data-weibei-compact-preview="true"][data-weibei-theme="stele"] #editor {
      background: transparent;
    }

    #editor::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    #editor::-webkit-scrollbar-track {
      background: transparent;
    }

    #editor::-webkit-scrollbar-thumb {
      border: 2px solid color-mix(in srgb, var(--paper) 88%, transparent);
      border-radius: 999px;
      background: transparent;
      transition: background-color .18s ease-out;
    }

    :root[data-weibei-theme="inkstone"] #editor::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] #editor::-webkit-scrollbar-thumb {
      border-color: rgba(15, 15, 15, .88);
    }

    #editor.weibei-scroll-active,
    #editor:hover,
    #editor:focus-within {
      scrollbar-color: rgba(92, 70, 46, .16) transparent;
    }

    #editor.weibei-scroll-active::-webkit-scrollbar-thumb,
    #editor:hover::-webkit-scrollbar-thumb,
    #editor:focus-within::-webkit-scrollbar-thumb {
      background: rgba(92, 70, 46, .16);
    }

    :root[data-weibei-theme="inkstone"] #editor.weibei-scroll-active,
    :root[data-weibei-theme="stele"] #editor.weibei-scroll-active,

    :root[data-weibei-theme="inkstone"] #editor:hover,
    :root[data-weibei-theme="stele"] #editor:hover,

    :root[data-weibei-theme="inkstone"] #editor:focus-within,
    :root[data-weibei-theme="stele"] #editor:focus-within {
      scrollbar-color: #3a3328 transparent;
    }

    :root[data-weibei-theme="inkstone"] #editor.weibei-scroll-active::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] #editor.weibei-scroll-active::-webkit-scrollbar-thumb,

    :root[data-weibei-theme="inkstone"] #editor:hover::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] #editor:hover::-webkit-scrollbar-thumb,

    :root[data-weibei-theme="inkstone"] #editor:focus-within::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] #editor:focus-within::-webkit-scrollbar-thumb {
      background: #3a3328;
    }

    :root[data-weibei-theme="inkstone"] #editor::-webkit-scrollbar-thumb:hover,
    :root[data-weibei-theme="stele"] #editor::-webkit-scrollbar-thumb:hover {
      background: #5c4331;
    }

    #editor::-webkit-scrollbar-thumb:hover {
      background: rgba(92, 70, 46, .24);
    }

    .ProseMirror pre::-webkit-scrollbar,
    .weibei-math-block::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    .ProseMirror pre::-webkit-scrollbar-track,
    .weibei-math-block::-webkit-scrollbar-track {
      background: transparent;
    }

    .ProseMirror pre::-webkit-scrollbar-thumb,
    .weibei-math-block::-webkit-scrollbar-thumb {
      border: 2px solid color-mix(in srgb, var(--paper) 88%, transparent);
      border-radius: 999px;
      background: transparent;
      transition: background-color .18s ease-out;
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror pre::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] .ProseMirror pre::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="inkstone"] .weibei-math-block::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] .weibei-math-block::-webkit-scrollbar-thumb {
      border-color: #171717;
    }

    .ProseMirror pre.weibei-scroll-active::-webkit-scrollbar-thumb,
    .ProseMirror pre:hover::-webkit-scrollbar-thumb,
    .ProseMirror pre:focus-within::-webkit-scrollbar-thumb,
    .weibei-math-block.weibei-scroll-active::-webkit-scrollbar-thumb,
    .weibei-math-block:hover::-webkit-scrollbar-thumb,
    .weibei-math-block:focus-within::-webkit-scrollbar-thumb {
      background: rgba(92, 70, 46, .16);
    }

    .ProseMirror pre::-webkit-scrollbar-thumb:hover,
    .weibei-math-block::-webkit-scrollbar-thumb:hover {
      background: rgba(92, 70, 46, .24);
    }

    .milkdown {
      max-width: 760px;
      min-height: calc(100vh - 92px);
      margin: 0 auto;
    }

    :root[data-weibei-compact-preview="true"] .milkdown {
      max-width: none;
      min-height: 0;
      margin: 0;
    }

    #frontmatter-panel {
      display: none;
      max-width: 760px;
      margin: 0 auto 18px;
      padding: 10px 12px;
      color: var(--muted);
      background: rgba(247, 236, 217, .54);
      border: 1px solid var(--line);
      border-left: 2px solid rgba(145, 38, 28, .34);
      font: 12px/1.55 -apple-system, BlinkMacSystemFont, "Songti SC", serif;
    }

    #frontmatter-panel[data-visible="true"] {
      display: block;
    }

    .frontmatter-title {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .frontmatter-row {
      display: flex;
      gap: 8px;
      padding: 1px 0;
    }

    .frontmatter-key {
      min-width: 72px;
      color: var(--ochre);
      font-family: "SF Mono", Menlo, ui-monospace, monospace;
      font-size: 11px;
    }

    :root[data-weibei-theme="inkstone"] #frontmatter-panel,
    :root[data-weibei-theme="stele"] #frontmatter-panel {
      background: var(--paper-raised);
      border-color: var(--line);
      border-left-color: var(--cinnabar-line);
    }

    :root {
      --weibei-text-scale: 1;
    }

    .ProseMirror {
      outline: none;
      min-height: calc(100vh - 92px);
      font-size: calc(17px * var(--weibei-text-scale));
      line-height: 1.82;
      caret-color: var(--cinnabar);
      word-break: break-word;
    }

    .ProseMirror.weibei-empty-document > p:first-child::before {
      content: attr(data-empty-placeholder);
      position: absolute;
      color: color-mix(in srgb, var(--faint) 58%, transparent);
      pointer-events: none;
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror {
      min-height: 0;
      font-size: calc(14px * var(--weibei-text-scale));
      line-height: 1.68;
    }

    :root[data-weibei-chat-wide="true"] .ProseMirror {
      font-size: calc(16px * var(--weibei-text-scale));
      line-height: 1.8;
    }

    .ProseMirror::selection,
    .ProseMirror ::selection {
      background: var(--selection);
    }

    .ProseMirror .ProseMirror-safari-ime-span {
      display: inline !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
      font-size: 0 !important;
      line-height: 0 !important;
    }

    .ProseMirror p:has(.ProseMirror-safari-ime-span) > br,
    .ProseMirror h1:has(.ProseMirror-safari-ime-span) > br,
    .ProseMirror h2:has(.ProseMirror-safari-ime-span) > br,
    .ProseMirror h3:has(.ProseMirror-safari-ime-span) > br,
    .ProseMirror h4:has(.ProseMirror-safari-ime-span) > br,
    .ProseMirror pre:has(.ProseMirror-safari-ime-span) br {
      display: none !important;
    }

    .ProseMirror h1,
    .ProseMirror h2,
    .ProseMirror h3,
    .ProseMirror h4,
    .ProseMirror h5,
    .ProseMirror h6 {
      letter-spacing: 0;
      line-height: 1.32;
      margin: 1.15em 0 .55em;
      font-weight: 650;
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror h1,
    :root[data-weibei-compact-preview="true"] .ProseMirror h2,
    :root[data-weibei-compact-preview="true"] .ProseMirror h3,
    :root[data-weibei-compact-preview="true"] .ProseMirror h4,
    :root[data-weibei-compact-preview="true"] .ProseMirror h5,
    :root[data-weibei-compact-preview="true"] .ProseMirror h6 {
      margin: .9em 0 .25em;
    }

    .ProseMirror h1 { font-size: 1.85rem; }
    .ProseMirror h2 { font-size: 1.42rem; }
    .ProseMirror h3 { font-size: 1.22rem; }
    .ProseMirror h4 { font-size: 1.12em; font-weight: 650; margin: 1em 0 .45em; }
    .ProseMirror h5 {
      font-size: .95em;
      font-weight: 650;
      letter-spacing: .02em;
      color: var(--muted);
      margin: .9em 0 .4em;
    }
    .ProseMirror h6 {
      font-size: .88em;
      font-weight: 650;
      letter-spacing: .02em;
      color: var(--muted);
      margin: .85em 0 .35em;
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror h4 {
      margin: .9em 0 .2em;
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror h5,
    :root[data-weibei-compact-preview="true"] .ProseMirror h6 {
      margin: .9em 0 .18em;
    }

    .ProseMirror p { margin: .65em 0; }

    :root[data-weibei-compact-preview="true"] .ProseMirror p {
      margin: .7em 0;
    }

    /* Read-only chat preview: model output often carries empty paragraphs
       (esp. around display math) — collapse them so formulas do not float
       inside a sea of blank lines. Notes editing keeps them visible. */
    :root[data-weibei-compact-preview="true"] .ProseMirror p:has(> .ProseMirror-trailingBreak:only-child) {
      display: none;
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror h1,
    :root[data-weibei-theme="stele"] .ProseMirror h1,

    :root[data-weibei-theme="inkstone"] .ProseMirror h2,
    :root[data-weibei-theme="stele"] .ProseMirror h2 {
      color: var(--blue-ink);
    }

    .ProseMirror a {
      color: var(--blue-ink);
      text-decoration-thickness: 1px;
      text-underline-offset: .18em;
    }
    .ProseMirror a[href^="weibei-source"] {
      color: var(--cinnabar);
      font-size: .78em;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      text-decoration: none;
      background: var(--cinnabar-soft);
      border: 1px solid var(--cinnabar-line);
      border-radius: 5px;
      padding: 1px 5px;
    }

    .ProseMirror img:not(.ProseMirror-separator) {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.1em 0;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(60, 45, 30, .14);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror img,
    :root[data-weibei-theme="stele"] .ProseMirror img {
      box-shadow: 0 1px 4px rgba(0, 0, 0, .38);
    }

    .ProseMirror img.ProseMirror-separator {
      display: inline !important;
      width: 0 !important;
      height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
    }

    .ProseMirror ul, .ProseMirror ol {
      padding-left: 1.45em;
      margin: .55em 0;
    }

    .ProseMirror li {
      margin: .18em 0;
      padding-left: .1em;
    }

    .ProseMirror ul li::marker,
    .ProseMirror ol li::marker {
      color: var(--faint);
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror li {
      margin: .26em 0;
    }

    .ProseMirror li[data-item-type="task"] {
      position: relative;
      list-style: none;
      padding-left: 1.55em;
    }

    .ProseMirror li[data-item-type="task"]::before {
      content: "";
      position: absolute;
      left: .05em;
      top: .62em;
      width: .82em;
      height: .82em;
      box-sizing: border-box;
      border: 1px solid rgba(57, 95, 72, .34);
      background: var(--paper-raised);
    }

    .ProseMirror li[data-item-type="task"][data-checked="true"]::before {
      background: var(--moss);
      border-color: var(--moss);
      box-shadow: inset 0 0 0 2px var(--paper-raised);
    }

    .ProseMirror li[data-item-type="task"][data-checked="true"] > p,
    .ProseMirror li[data-item-type="task"][data-checked="true"] {
      color: var(--muted);
    }

    .ProseMirror s,
    .ProseMirror del {
      color: var(--faint);
      text-decoration-color: rgba(145, 38, 28, .42);
      text-decoration-thickness: 1px;
    }

    .ProseMirror table {
      display: block;
      width: max-content;
      min-width: 100%;
      max-width: 100%;
      margin: 1.1em 0;
      border-collapse: collapse;
      table-layout: auto;
      font-size: .96em;
      background: transparent;
      overflow-x: auto;
    }

    .ProseMirror th,
    .ProseMirror td {
      border: 0;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 62%, transparent);
      padding: .5em .7em;
      text-align: left;
      vertical-align: top;
    }

    .ProseMirror th {
      color: var(--ink);
      background: transparent;
      font-weight: 650;
      letter-spacing: .01em;
      border-bottom: 1.5px solid var(--line);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror th,
    :root[data-weibei-theme="stele"] .ProseMirror th {
      color: var(--blue-ink);
      background: transparent;
    }

    .ProseMirror td > p,
    .ProseMirror th > p {
      margin: 0;
      min-height: 1.55em;
    }

    .ProseMirror hr {
      border: 0;
      border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
      margin: 1.7em 0;
    }

    .ProseMirror blockquote {
      margin: 1em 0;
      padding: .1em 0 .1em 1em;
      border-left: 3px solid var(--cinnabar-line);
      background: transparent;
      color: var(--muted);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote,

    :root[data-weibei-glass] .weibei-slash-menu { -webkit-backdrop-filter: blur(10px) saturate(120%); backdrop-filter: blur(10px) saturate(120%); }
    .weibei-slash-menu[data-show="false"] { display: none; }
    .weibei-line-plus { position: fixed; z-index: 110; width: 24px; height: 24px; padding: 0; color: var(--faint); background: transparent; border: 0; border-radius: 4px; font: 17px/24px -apple-system, BlinkMacSystemFont, sans-serif; cursor: pointer; }
    .weibei-line-plus:hover, .weibei-line-plus:focus-visible { color: var(--ink); background: color-mix(in srgb, var(--paper-raised) 72%, transparent); outline: none; }
    .weibei-table-toolbar { position: fixed; z-index: 115; display: flex; gap: 2px; padding: 3px; color: var(--floating-ink); background: var(--floating-surface); border: 1px solid var(--floating-line); border-radius: 7px; box-shadow: var(--floating-toolbar-shadow); opacity: 0; pointer-events: none; transition: opacity .15s ease-out; }
    .weibei-table-toolbar[data-state="open"] { opacity: 1; pointer-events: auto; }
    :root[data-weibei-reduce-motion="true"] .weibei-table-toolbar { transition: none; }
    .weibei-table-toolbar button { min-width: 34px; height: 22px; padding: 0 6px; color: var(--floating-muted); background: transparent; border: 0; border-radius: 4px; font: 11px/22px -apple-system, BlinkMacSystemFont, sans-serif; }
    .weibei-table-toolbar button:hover, .weibei-table-toolbar button:focus-visible { color: var(--floating-ink); background: color-mix(in srgb, var(--floating-line) 25%, transparent); outline: none; }
    .weibei-slash-section + .weibei-slash-section { margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--floating-line); }
    .weibei-slash-group { padding: 4px 8px 3px; color: var(--floating-faint); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; user-select: none; }
    .weibei-slash-command { border-radius: 6px; }
    .weibei-slash-command-button { display: flex; width: 100%; height: 31px; align-items: center; box-sizing: border-box; padding: 0 9px; color: var(--floating-ink); background: transparent; border: 0; border-radius: 6px; font: 500 13px/1 -apple-system, BlinkMacSystemFont, "Songti SC", serif; text-align: left; cursor: default; }
    .weibei-slash-command.is-active > .weibei-slash-command-button { color: var(--floating-accent); background: var(--floating-accent-soft); }
    .weibei-slash-empty { padding: 13px 10px; color: var(--floating-faint); font-size: 12px; }
    .weibei-slash-error { margin: 3px 4px 5px; padding: 6px 7px; color: var(--floating-accent); background: var(--floating-accent-soft); border-radius: 5px; font-size: 11px; }
    .weibei-slash-table-panel { position: fixed; z-index: 121; width: 164px; box-sizing: border-box; padding: 8px; color: var(--floating-ink); background: var(--floating-surface); border: 1px solid var(--floating-line); border-radius: 9px; box-shadow: var(--floating-menu-shadow); }
    :root[data-weibei-glass] .weibei-table-toolbar,
    :root[data-weibei-glass] .weibei-slash-table-panel { -webkit-backdrop-filter: blur(10px) saturate(120%); backdrop-filter: blur(10px) saturate(120%); }
    .weibei-slash-stepper { display: grid; grid-template-columns: minmax(24px, 1fr) 28px 38px 28px; align-items: center; gap: 4px; width: 100%; min-height: 34px; box-sizing: border-box; padding: 0 4px; color: var(--floating-muted); font-size: 12px; border-radius: 6px; }
    .weibei-slash-stepper.is-focused { background: var(--floating-accent-soft); }
    .weibei-slash-stepper-label { min-width: 0; }
    .weibei-slash-stepper button, .weibei-slash-table-insert { color: var(--floating-muted); background: transparent; border: 1px solid var(--floating-line); border-radius: 4px; }
    .weibei-slash-stepper button { width: 28px; height: 27px; padding: 0; }
    .weibei-slash-stepper-input { width: 38px; height: 27px; box-sizing: border-box; padding: 0 2px; color: var(--floating-ink); background: var(--floating-input); border: 1px solid var(--floating-line); border-radius: 4px; font: inherit; text-align: center; outline: none; appearance: textfield; }
    .weibei-slash-stepper-input:focus { border-color: var(--floating-accent-line); background: var(--floating-input-focus); }
    .weibei-slash-stepper-input::-webkit-inner-spin-button, .weibei-slash-stepper-input::-webkit-outer-spin-button { margin: 0; -webkit-appearance: none; }
    .weibei-slash-table-insert { width: 100%; margin-top: 7px; padding: 6px; color: var(--floating-ink); }

    .ProseMirror-focused {
      outline: none;
    }

    .editor-status {
      max-width: 760px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .editor-status.error {
      color: var(--cinnabar);
      font-family: "SF Mono", Menlo, ui-monospace, monospace;
      white-space: pre-wrap;
    }

    /* Chat previews cover the loading window with their own thinking
       indicator; the 14px loading line would flash a third type size at the
       start of every streamed answer. Errors stay visible. */
    :root[data-weibei-compact-preview="true"] .editor-status:not(.error) {
      display: none;
    }

    /* Streaming appearance: newly typed characters fade in and a quiet caret
       follows the flow, so evenly paced inserts read as a continuous stream
       instead of discrete character pops. The 260ms fade makes ~8 characters
       dissolve simultaneously at typical Chinese output rates, bridging the
       33ms arrival gaps into a continuous flow. Opacity-only = cheap. */
    .wb-stream-in {
      animation: wb-stream-in 260ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }

    @keyframes wb-stream-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .wb-stream-caret {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      margin-left: 1px;
      vertical-align: -0.18em;
      border-radius: 1px;
      background: currentColor;
      opacity: 0.7;
      animation: wb-stream-caret-blink 1.06s ease-in-out infinite;
    }

    @keyframes wb-stream-caret-blink {
      0%, 100% { opacity: 0.7; }
      50%      { opacity: 0.06; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wb-stream-in { animation: none; }
      .wb-stream-caret { animation: none; }
    }
  </style>
</head>
<body>
  <main id="editor">
    <section id="frontmatter-panel" aria-label="Markdown Properties"></section>
    <div id="editor-status" class="editor-status">正在载入魏碑写作内核...</div>
  </main>
  <script>
    window.WeiBeiEditorBootFailed = function(error) {
      var root = document.querySelector('#editor');
      if (!root) return;
      var text = error && (error.stack || error.message)
        ? [error.message, error.stack].filter(Boolean).join('\n')
        : String(error);
      root.innerHTML = '<pre class="editor-status error">Milkdown 初始化失败\n' + text.replace(/[<>&]/g, function(ch) {
        return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch];
      }) + '</pre>';
      window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.editorFailure
        && window.webkit.messageHandlers.editorFailure.postMessage({
          documentID: window.weiBeiDocumentID || '',
          message: text
        });
    };
    window.addEventListener('error', function(event) {
      window.WeiBeiEditorBootFailed(event.error || new Error(
        event.message + ' at ' + event.filename + ':' + event.lineno + ':' + event.colno
      ));
    });
    window.addEventListener('unhandledrejection', function(event) {
      window.WeiBeiEditorBootFailed(event.reason);
    });
  </script>
  <script>
    var weiBeiEntry = document.createElement('script');
    weiBeiEntry.src = window.weiBeiMarkdownEditable === true
      ? './editor-entry.js'
      : './viewer-entry.js';
    weiBeiEntry.onerror = function() {
      window.WeiBeiEditorBootFailed(new Error('编辑器本地入口加载失败'));
    };
    document.body.appendChild(weiBeiEntry);
  </script>
  <script>
    document.getElementById('editor').addEventListener('pointerdown', function(event) {
      if (window.weiBeiMarkdownEditable !== true
          || (event.target instanceof Element && event.target.closest('.ProseMirror'))) return;
      var editor = document.querySelector('.ProseMirror');
      if (!editor) return;
      editor.focus();
      var range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    });
  </script>
</body>
</html>
