<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>魏碑笔记</title>
  <link rel="stylesheet" href="./editor.css">
  <style>
    :root,
    :root[data-weibei-theme="paper"] {
      color-scheme: light;
      --paper: #f1e4cf;
      --paper-raised: #f7ecd9;
      --ink: #1d1814;
      --muted: rgba(58, 46, 38, .72);
      --faint: rgba(58, 46, 38, .50);
      --line: rgba(92, 70, 46, .28);
      --cinnabar: #91261c;
      --cinnabar-soft: rgba(145, 38, 28, .10);
      --cinnabar-line: rgba(145, 38, 28, .26);
      --ochre: #77582f;
      --moss: #395f48;
      --blue-ink: #31566b;
      --violet-ink: #5d4b6d;
      --code: rgba(29, 24, 20, .06);
      --code-paper: rgba(29, 24, 20, .052);
      --selection: rgba(145, 38, 28, .18);
    }

    :root[data-weibei-theme="inkstone"] {
      color-scheme: dark;
      --paper: #0f0f0f;
      --paper-raised: #151515;
      --ink: #d7cbb0;
      --muted: rgba(155, 145, 120, .88);
      --faint: rgba(111, 102, 85, .86);
      --line: #2d2d2d;
      --cinnabar: #a6362b;
      --cinnabar-soft: rgba(92, 38, 33, .62);
      --cinnabar-line: rgba(166, 54, 43, .45);
      --ochre: #8b5e3c;
      --moss: #b88a42;
      --blue-ink: #c8b98a;
      --violet-ink: #b99b72;
      --code: rgba(255, 255, 255, .05);
      --code-paper: #171717;
      --selection: rgba(166, 54, 43, .35);
    }

    :root[data-weibei-theme="xuan"] {
      color-scheme: light;
      --paper: #f7f4ef;
      --paper-raised: #fcfbf8;
      --ink: #25231f;
      --muted: rgba(90, 86, 78, .74);
      --faint: rgba(90, 86, 78, .52);
      --line: rgba(110, 104, 92, .22);
      --cinnabar: #8a2f24;
      --cinnabar-soft: rgba(138, 47, 36, .09);
      --cinnabar-line: rgba(138, 47, 36, .24);
      --ochre: #6e634f;
      --moss: #3f614c;
      --blue-ink: #335266;
      --violet-ink: #5a4d64;
      --code: rgba(37, 35, 31, .05);
      --code-paper: rgba(37, 35, 31, .045);
      --selection: rgba(138, 47, 36, .16);
    }

    :root[data-weibei-theme="stele"] {
      color-scheme: dark;
      --paper: #16181c;
      --paper-raised: #1e2228;
      --ink: #d2d6dc;
      --muted: rgba(154, 161, 171, .88);
      --faint: rgba(110, 118, 130, .86);
      --line: #3a414c;
      --cinnabar: #b04034;
      --cinnabar-soft: rgba(90, 42, 40, .58);
      --cinnabar-line: rgba(176, 64, 52, .45);
      --ochre: #8a7a5c;
      --moss: #8fa06a;
      --blue-ink: #b8c4d0;
      --violet-ink: #a8b0c0;
      --code: rgba(255, 255, 255, .05);
      --code-paper: #1a1e24;
      --selection: rgba(176, 64, 52, .32);
    }

    :root[data-weibei-theme="xuan"] #editor {
      background: color-mix(in srgb, var(--paper) 90%, transparent);
    }

    :root[data-weibei-theme="stele"] body {
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, .03), transparent 28%),
        linear-gradient(180deg, #1a1d22 0%, #12151a 100%);
    }

    :root[data-weibei-compact-preview="true"][data-weibei-theme="stele"] body {
      background: transparent;
    }


    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: "Songti SC", "STSong", ui-serif, serif;
    }

    body {
      overflow: hidden;
    }

    :root[data-weibei-theme="inkstone"] body,
    :root[data-weibei-theme="stele"] body {
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, .025), transparent 28%),
        linear-gradient(180deg, #101010 0%, #0b0b0b 100%);
    }

    :root[data-weibei-compact-preview="true"][data-weibei-theme="inkstone"] body,
:root[data-weibei-compact-preview="true"][data-weibei-theme="stele"] body {
      background: transparent;
    }

    #editor {
      box-sizing: border-box;
      height: 100vh;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      padding: 28px 34px 64px;
      background: color-mix(in srgb, var(--paper) 88%, transparent);
    }

    :root[data-weibei-compact-preview="true"] #editor {
      height: auto;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      background: transparent;
    }

    :root[data-weibei-theme="inkstone"] #editor,
    :root[data-weibei-theme="stele"] #editor {
      background: rgba(15, 15, 15, .88);
    }

    :root[data-weibei-compact-preview="true"][data-weibei-theme="inkstone"] #editor,
:root[data-weibei-compact-preview="true"][data-weibei-theme="stele"] #editor {
      background: transparent;
    }

    #editor::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    #editor::-webkit-scrollbar-track {
      background: transparent;
    }

    #editor::-webkit-scrollbar-thumb {
      border: 2px solid color-mix(in srgb, var(--paper) 88%, transparent);
      border-radius: 999px;
      background: transparent;
      transition: background-color .18s ease-out;
    }

    :root[data-weibei-theme="inkstone"] #editor::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] #editor::-webkit-scrollbar-thumb {
      border-color: rgba(15, 15, 15, .88);
    }

    #editor.weibei-scroll-active,
    #editor:hover,
    #editor:focus-within {
      scrollbar-color: rgba(92, 70, 46, .16) transparent;
    }

    #editor.weibei-scroll-active::-webkit-scrollbar-thumb,
    #editor:hover::-webkit-scrollbar-thumb,
    #editor:focus-within::-webkit-scrollbar-thumb {
      background: rgba(92, 70, 46, .16);
    }

    :root[data-weibei-theme="inkstone"] #editor.weibei-scroll-active,
    :root[data-weibei-theme="stele"] #editor.weibei-scroll-active,

    :root[data-weibei-theme="inkstone"] #editor:hover,
    :root[data-weibei-theme="stele"] #editor:hover,

    :root[data-weibei-theme="inkstone"] #editor:focus-within,
    :root[data-weibei-theme="stele"] #editor:focus-within {
      scrollbar-color: #3a3328 transparent;
    }

    :root[data-weibei-theme="inkstone"] #editor.weibei-scroll-active::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] #editor.weibei-scroll-active::-webkit-scrollbar-thumb,

    :root[data-weibei-theme="inkstone"] #editor:hover::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] #editor:hover::-webkit-scrollbar-thumb,

    :root[data-weibei-theme="inkstone"] #editor:focus-within::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] #editor:focus-within::-webkit-scrollbar-thumb {
      background: #3a3328;
    }

    :root[data-weibei-theme="inkstone"] #editor::-webkit-scrollbar-thumb:hover,
    :root[data-weibei-theme="stele"] #editor::-webkit-scrollbar-thumb:hover {
      background: #5c4331;
    }

    #editor::-webkit-scrollbar-thumb:hover {
      background: rgba(92, 70, 46, .24);
    }

    .ProseMirror pre::-webkit-scrollbar,
    .ProseMirror div[data-type="math_block"]::-webkit-scrollbar,
    .ProseMirror div[data-type="math-block"]::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    .ProseMirror pre::-webkit-scrollbar-track,
    .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-track,
    .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-track {
      background: transparent;
    }

    .ProseMirror pre::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-thumb {
      border: 2px solid color-mix(in srgb, var(--paper) 88%, transparent);
      border-radius: 999px;
      background: transparent;
      transition: background-color .18s ease-out;
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror pre::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] .ProseMirror pre::-webkit-scrollbar-thumb,

    :root[data-weibei-theme="inkstone"] .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-thumb,

    :root[data-weibei-theme="inkstone"] .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="stele"] .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-thumb {
      border-color: #171717;
    }

    .ProseMirror pre.weibei-scroll-active::-webkit-scrollbar-thumb,
    .ProseMirror pre:hover::-webkit-scrollbar-thumb,
    .ProseMirror pre:focus-within::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math_block"].weibei-scroll-active::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math_block"]:hover::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math_block"]:focus-within::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math-block"].weibei-scroll-active::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math-block"]:hover::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math-block"]:focus-within::-webkit-scrollbar-thumb {
      background: rgba(92, 70, 46, .16);
    }

    .ProseMirror pre::-webkit-scrollbar-thumb:hover,
    .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-thumb:hover,
    .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-thumb:hover {
      background: rgba(92, 70, 46, .24);
    }

    .milkdown {
      max-width: 760px;
      min-height: calc(100vh - 92px);
      margin: 0 auto;
    }

    :root[data-weibei-compact-preview="true"] .milkdown {
      max-width: none;
      min-height: 0;
      margin: 0;
    }

    #frontmatter-panel {
      display: none;
      max-width: 760px;
      margin: 0 auto 18px;
      padding: 10px 12px;
      color: var(--muted);
      background: rgba(247, 236, 217, .54);
      border: 1px solid var(--line);
      border-left: 2px solid rgba(145, 38, 28, .34);
      font: 12px/1.55 -apple-system, BlinkMacSystemFont, "Songti SC", serif;
    }

    #frontmatter-panel[data-visible="true"] {
      display: block;
    }

    .frontmatter-title {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .frontmatter-row {
      display: flex;
      gap: 8px;
      padding: 1px 0;
    }

    .frontmatter-key {
      min-width: 72px;
      color: var(--ochre);
      font-family: "SF Mono", Menlo, ui-monospace, monospace;
      font-size: 11px;
    }

    :root[data-weibei-theme="inkstone"] #frontmatter-panel,
    :root[data-weibei-theme="stele"] #frontmatter-panel {
      background: var(--paper-raised);
      border-color: var(--line);
      border-left-color: var(--cinnabar-line);
    }

    .ProseMirror {
      outline: none;
      min-height: calc(100vh - 92px);
      font-size: 16px;
      line-height: 1.82;
      caret-color: var(--cinnabar);
      word-break: break-word;
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror {
      min-height: 0;
      font-size: 14px;
      line-height: 1.68;
    }

    .ProseMirror::selection,
    .ProseMirror ::selection {
      background: var(--selection);
    }

    .ProseMirror h1,
    .ProseMirror h2,
    .ProseMirror h3 {
      letter-spacing: 0;
      line-height: 1.32;
      margin: 1.15em 0 .55em;
      font-weight: 650;
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror h1,
    :root[data-weibei-compact-preview="true"] .ProseMirror h2,
    :root[data-weibei-compact-preview="true"] .ProseMirror h3 {
      margin: .55em 0 .25em;
    }

    .ProseMirror h1 { font-size: 1.85rem; }
    .ProseMirror h2 { font-size: 1.42rem; }
    .ProseMirror h3 { font-size: 1.16rem; }
    .ProseMirror p { margin: .55em 0; }

    :root[data-weibei-theme="inkstone"] .ProseMirror h1,
    :root[data-weibei-theme="stele"] .ProseMirror h1,

    :root[data-weibei-theme="inkstone"] .ProseMirror h2,
    :root[data-weibei-theme="stele"] .ProseMirror h2 {
      color: var(--blue-ink);
    }

    .ProseMirror a {
      color: var(--blue-ink);
      text-decoration-thickness: 1px;
      text-underline-offset: .18em;
    }

    .ProseMirror img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.1em 0;
      border: 1px solid var(--line);
    }

    .ProseMirror ul, .ProseMirror ol {
      padding-left: 1.45em;
      margin: .55em 0;
    }

    .ProseMirror li {
      margin: .18em 0;
      padding-left: .1em;
    }

    .ProseMirror li[data-item-type="task"] {
      position: relative;
      list-style: none;
      padding-left: 1.55em;
    }

    .ProseMirror li[data-item-type="task"]::before {
      content: "";
      position: absolute;
      left: .05em;
      top: .62em;
      width: .82em;
      height: .82em;
      box-sizing: border-box;
      border: 1px solid rgba(57, 95, 72, .34);
      background: var(--paper-raised);
    }

    .ProseMirror li[data-item-type="task"][data-checked="true"]::before {
      background: var(--moss);
      border-color: var(--moss);
      box-shadow: inset 0 0 0 2px var(--paper-raised);
    }

    .ProseMirror li[data-item-type="task"][data-checked="true"] > p,
    .ProseMirror li[data-item-type="task"][data-checked="true"] {
      color: var(--muted);
    }

    .ProseMirror s,
    .ProseMirror del {
      color: var(--faint);
      text-decoration-color: rgba(145, 38, 28, .42);
      text-decoration-thickness: 1px;
    }

    .ProseMirror table {
      width: 100%;
      margin: 1.05em 0;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: .96em;
      background: rgba(251, 245, 234, .52);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror table,
    :root[data-weibei-theme="stele"] .ProseMirror table {
      background: rgba(255, 255, 255, .02);
    }

    .ProseMirror th,
    .ProseMirror td {
      border: 1px solid var(--line);
      padding: 7px 9px;
      vertical-align: top;
    }

    .ProseMirror th {
      color: var(--ink);
      background: rgba(92, 70, 46, .075);
      font-weight: 650;
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror th,
    :root[data-weibei-theme="stele"] .ProseMirror th {
      color: var(--blue-ink);
      background: rgba(200, 185, 138, .08);
    }

    .ProseMirror td > p,
    .ProseMirror th > p {
      margin: 0;
      min-height: 1.55em;
    }

    .ProseMirror hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 1.6em 0;
    }

    .ProseMirror blockquote {
      margin: 1em 0;
      padding: .55em .9em;
      border-left: 3px solid rgba(92, 70, 46, .36);
      background: rgba(251, 245, 234, .48);
      color: var(--muted);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote,
    :root[data-weibei-theme="stele"] .ProseMirror blockquote {
      border-left-color: rgba(166, 54, 43, .55);
      background: rgba(166, 54, 43, .08);
      color: #c9bfa5;
    }

    .ProseMirror blockquote.weibei-callout {
      position: relative;
      padding: .72em 1em .72em 1.05em;
      border-left-width: 2px;
      background: var(--paper-raised);
      box-shadow: inset 0 0 0 1px rgba(92, 70, 46, .12);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout,
    :root[data-weibei-theme="stele"] .ProseMirror blockquote.weibei-callout {
      background: rgba(255, 255, 255, .035);
      box-shadow: inset 0 0 0 1px rgba(45, 45, 45, .92);
    }

    .ProseMirror blockquote.weibei-callout::before {
      display: block;
      margin-bottom: .24em;
      font-size: .78em;
      letter-spacing: 0;
      color: var(--blue-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Songti SC", serif;
      font-weight: 650;
    }

    .ProseMirror blockquote.weibei-callout-tip,
    .ProseMirror blockquote.weibei-callout-success {
      border-left-color: var(--moss);
      background: rgba(63, 105, 82, .08);
    }
    .ProseMirror blockquote.weibei-callout-tip::before { color: var(--moss); }
    .ProseMirror blockquote.weibei-callout-success::before { color: var(--moss); }
    .ProseMirror blockquote.weibei-callout-important,
    .ProseMirror blockquote.weibei-callout-question,
    .ProseMirror blockquote.weibei-callout-example {
      border-left-color: var(--blue-ink);
      background: rgba(52, 91, 116, .075);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout-important,
    :root[data-weibei-theme="stele"] .ProseMirror blockquote.weibei-callout-important,

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout-question,
    :root[data-weibei-theme="stele"] .ProseMirror blockquote.weibei-callout-question,

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout-example,
    :root[data-weibei-theme="stele"] .ProseMirror blockquote.weibei-callout-example {
      background: rgba(200, 185, 138, .07);
    }
    .ProseMirror blockquote.weibei-callout-important::before { color: var(--blue-ink); }
    .ProseMirror blockquote.weibei-callout-question::before { color: var(--blue-ink); }
    .ProseMirror blockquote.weibei-callout-example::before { color: var(--blue-ink); }
    .ProseMirror blockquote.weibei-callout-warning {
      border-left-color: var(--ochre);
      background: rgba(135, 97, 47, .08);
    }
    .ProseMirror blockquote.weibei-callout-warning::before {
      color: var(--ochre);
    }
    .ProseMirror blockquote.weibei-callout-summary {
      border-left-color: var(--moss);
      background: rgba(63, 105, 82, .08);
    }
    .ProseMirror blockquote.weibei-callout-abstract {
      border-left-color: var(--moss);
      background: rgba(63, 105, 82, .08);
    }
    .ProseMirror blockquote.weibei-callout-summary::before {
      color: var(--moss);
    }
    .ProseMirror blockquote.weibei-callout-abstract::before {
      color: var(--moss);
    }
    .ProseMirror blockquote.weibei-callout-caution,
    .ProseMirror blockquote.weibei-callout-danger,
    .ProseMirror blockquote.weibei-callout-failure,
    .ProseMirror blockquote.weibei-callout-bug {
      border-left-color: var(--cinnabar);
      background: var(--cinnabar-soft);
    }
    .ProseMirror blockquote.weibei-callout-caution::before { color: var(--cinnabar); }
    .ProseMirror blockquote.weibei-callout-danger::before { color: var(--cinnabar); }
    .ProseMirror blockquote.weibei-callout-failure::before { color: var(--cinnabar); }
    .ProseMirror blockquote.weibei-callout-bug::before { color: var(--cinnabar); }
    .ProseMirror blockquote.weibei-callout::before { content: attr(data-callout-title); }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout[data-callout-fold="-"] {
      cursor: pointer;
    }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout[data-callout-fold="-"] > * {
      display: none;
    }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout[data-callout-fold="-"].weibei-callout-open > * {
      display: revert;
    }

    body[data-editable="true"] .ProseMirror blockquote.weibei-callout.weibei-callout-has-heading::before {
      display: none;
    }

    .ProseMirror blockquote.weibei-callout .weibei-callout-heading {
      margin: 0 0 .34em;
      color: var(--blue-ink);
      font-size: .78em;
      font-weight: 650;
      letter-spacing: 0;
    }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout .weibei-callout-heading {
      display: none;
    }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout[data-callout-fold="-"].weibei-callout-open > .weibei-callout-heading {
      display: none;
    }

    .ProseMirror blockquote.weibei-callout[data-callout-title="阅读线索"] {
      margin: .76em 0;
      padding: .42em .72em .42em .86em;
      background: rgba(251, 245, 234, .18);
      box-shadow: none;
      border-left-color: rgba(145, 38, 28, .28);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout[data-callout-title="阅读线索"],
    :root[data-weibei-theme="stele"] .ProseMirror blockquote.weibei-callout[data-callout-title="阅读线索"] {
      background: rgba(166, 54, 43, .055);
      border-left-color: rgba(166, 54, 43, .38);
    }

    .ProseMirror blockquote.weibei-callout[data-callout-title="阅读线索"] .weibei-callout-heading {
      margin-bottom: .18em;
      color: var(--muted);
      font-size: .72em;
      font-weight: 620;
    }

    .ProseMirror blockquote.weibei-callout-tip .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-success .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-summary .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-abstract .weibei-callout-heading {
      color: var(--moss);
    }

    .ProseMirror blockquote.weibei-callout-warning .weibei-callout-heading {
      color: var(--ochre);
    }

    .ProseMirror blockquote.weibei-callout-caution .weibei-callout-heading,

      var root = document.querySelector('#editor');
      if (!root) return;
      var text = error && (error.stack || error.message) ? (error.stack || error.message) : String(error);
      root.innerHTML = '<pre class="editor-status error">Milkdown 初始化失败\n' + text.replace(/[<>&]/g, function(ch) {
        return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch];
      }) + '</pre>';
    };
    window.addEventListener('error', function(event) {
      window.WeiBeiEditorBootFailed(event.error || event.message);
    });
    window.addEventListener('unhandledrejection', function(event) {
      window.WeiBeiEditorBootFailed(event.reason);
    });
  </script>
  <script src="./editor.js"></script>
</body>
</html>
