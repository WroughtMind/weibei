<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>魏碑笔记</title>
  <link rel="stylesheet" href="./editor.css">
  <style>
    :root {
      color-scheme: light;
      --paper: #f1e4cf;
      --paper-raised: #f7ecd9;
      --host-paper: #f6eedd;
      --ink: #1d1814;
      --muted: rgba(58, 46, 38, .72);
      --faint: rgba(58, 46, 38, .50);
      --line: rgba(92, 70, 46, .28);
      --cinnabar: #91261c;
      --cinnabar-soft: rgba(145, 38, 28, .10);
      --cinnabar-line: rgba(145, 38, 28, .26);
      --ochre: #77582f;
      --moss: #395f48;
      --blue-ink: #31566b;
      --violet-ink: #5d4b6d;
      --code: rgba(29, 24, 20, .06);
      --code-paper: rgba(29, 24, 20, .052);
      --selection: rgba(145, 38, 28, .18);
    }

    :root[data-weibei-theme="inkstone"] {
      color-scheme: dark;
      --paper: #0f0f0f;
      --paper-raised: #151515;
      --host-paper: #121212;
      --ink: #d7cbb0;
      --muted: rgba(155, 145, 120, .88);
      --faint: rgba(111, 102, 85, .86);
      --line: #2d2d2d;
      --cinnabar: #a6362b;
      --cinnabar-soft: rgba(92, 38, 33, .62);
      --cinnabar-line: rgba(166, 54, 43, .45);
      --ochre: #8b5e3c;
      --moss: #b88a42;
      --blue-ink: #c8b98a;
      --violet-ink: #b99b72;
      --code: rgba(255, 255, 255, .05);
      --code-paper: #171717;
      --selection: rgba(166, 54, 43, .35);
    }

    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: "Songti SC", "STSong", ui-serif, serif;
    }

    body {
      overflow: hidden;
    }

    :root[data-weibei-theme="inkstone"] body {
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, .025), transparent 28%),
        linear-gradient(180deg, #101010 0%, #0b0b0b 100%);
    }

    :root[data-weibei-compact-preview="true"][data-weibei-theme="inkstone"] body {
      background: transparent;
    }

    :root[data-weibei-compact-preview="true"],
    :root[data-weibei-compact-preview="true"] body {
      background: var(--host-paper);
    }

    #editor {
      box-sizing: border-box;
      height: 100vh;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      padding: 28px 34px 64px;
      background: rgba(239, 225, 199, .72);
    }

    :root[data-weibei-compact-preview="true"] #editor {
      height: auto;
      min-height: 0;
      overflow: hidden;
      padding: 0;
      background: var(--host-paper);
    }

    :root[data-weibei-theme="inkstone"] #editor {
      background: rgba(15, 15, 15, .88);
    }

    :root[data-weibei-compact-preview="true"][data-weibei-theme="inkstone"] #editor {
      background: var(--host-paper);
    }

    #editor::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    #editor::-webkit-scrollbar-track {
      background: transparent;
    }

    #editor::-webkit-scrollbar-thumb {
      border: 2px solid rgba(239, 225, 199, .72);
      border-radius: 6px;
      background: transparent;
      transition: background-color .18s ease-out;
    }

    :root[data-weibei-theme="inkstone"] #editor::-webkit-scrollbar-thumb {
      border-color: rgba(15, 15, 15, .88);
    }

    #editor.weibei-scroll-active,
    #editor:hover,
    #editor:focus-within {
      scrollbar-color: rgba(92, 70, 46, .16) transparent;
    }

    #editor.weibei-scroll-active::-webkit-scrollbar-thumb,
    #editor:hover::-webkit-scrollbar-thumb,
    #editor:focus-within::-webkit-scrollbar-thumb {
      background: rgba(92, 70, 46, .16);
    }

    :root[data-weibei-theme="inkstone"] #editor.weibei-scroll-active,
    :root[data-weibei-theme="inkstone"] #editor:hover,
    :root[data-weibei-theme="inkstone"] #editor:focus-within {
      scrollbar-color: #3a3328 transparent;
    }

    :root[data-weibei-theme="inkstone"] #editor.weibei-scroll-active::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="inkstone"] #editor:hover::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="inkstone"] #editor:focus-within::-webkit-scrollbar-thumb {
      background: #3a3328;
    }

    :root[data-weibei-theme="inkstone"] #editor::-webkit-scrollbar-thumb:hover {
      background: #5c4331;
    }

    #editor::-webkit-scrollbar-thumb:hover {
      background: rgba(92, 70, 46, .24);
    }

    .ProseMirror pre::-webkit-scrollbar,
    .ProseMirror div[data-type="math_block"]::-webkit-scrollbar,
    .ProseMirror div[data-type="math-block"]::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    .ProseMirror pre::-webkit-scrollbar-track,
    .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-track,
    .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-track {
      background: transparent;
    }

    .ProseMirror pre::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-thumb {
      border: 2px solid rgba(239, 225, 199, .72);
      border-radius: 6px;
      background: transparent;
      transition: background-color .18s ease-out;
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror pre::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="inkstone"] .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-thumb,
    :root[data-weibei-theme="inkstone"] .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-thumb {
      border-color: #171717;
    }

    .ProseMirror pre.weibei-scroll-active::-webkit-scrollbar-thumb,
    .ProseMirror pre:hover::-webkit-scrollbar-thumb,
    .ProseMirror pre:focus-within::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math_block"].weibei-scroll-active::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math_block"]:hover::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math_block"]:focus-within::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math-block"].weibei-scroll-active::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math-block"]:hover::-webkit-scrollbar-thumb,
    .ProseMirror div[data-type="math-block"]:focus-within::-webkit-scrollbar-thumb {
      background: rgba(92, 70, 46, .16);
    }

    .ProseMirror pre::-webkit-scrollbar-thumb:hover,
    .ProseMirror div[data-type="math_block"]::-webkit-scrollbar-thumb:hover,
    .ProseMirror div[data-type="math-block"]::-webkit-scrollbar-thumb:hover {
      background: rgba(92, 70, 46, .24);
    }

    .milkdown {
      max-width: 760px;
      min-height: calc(100vh - 92px);
      margin: 0 auto;
    }

    :root[data-weibei-compact-preview="true"] .milkdown {
      max-width: none;
      min-height: 0;
      margin: 0;
      background: var(--host-paper);
    }

    #frontmatter-panel {
      display: none;
      max-width: 760px;
      margin: 0 auto 18px;
      padding: 10px 12px;
      color: var(--muted);
      background: rgba(247, 236, 217, .54);
      border: 1px solid var(--line);
      border-left: 2px solid rgba(145, 38, 28, .34);
      font: 12px/1.55 -apple-system, BlinkMacSystemFont, "Songti SC", serif;
    }

    #frontmatter-panel[data-visible="true"] {
      display: block;
    }

    .frontmatter-title {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .frontmatter-row {
      display: flex;
      gap: 8px;
      padding: 1px 0;
    }

    .frontmatter-key {
      min-width: 72px;
      color: var(--ochre);
      font-family: "SF Mono", Menlo, ui-monospace, monospace;
      font-size: 11px;
    }

    :root[data-weibei-theme="inkstone"] #frontmatter-panel {
      background: var(--paper-raised);
      border-color: var(--line);
      border-left-color: var(--cinnabar-line);
    }

    .ProseMirror {
      outline: none;
      min-height: calc(100vh - 92px);
      font-size: 16px;
      line-height: 1.82;
      caret-color: var(--cinnabar);
      word-break: break-word;
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror {
      min-height: 0;
      font-size: 14px;
      line-height: 1.68;
      background: var(--host-paper);
    }

    .ProseMirror::selection,
    .ProseMirror ::selection {
      background: var(--selection);
    }

    .ProseMirror h1,
    .ProseMirror h2,
    .ProseMirror h3 {
      letter-spacing: 0;
      line-height: 1.32;
      margin: 1.15em 0 .55em;
      font-weight: 650;
    }

    :root[data-weibei-compact-preview="true"] .ProseMirror h1,
    :root[data-weibei-compact-preview="true"] .ProseMirror h2,
    :root[data-weibei-compact-preview="true"] .ProseMirror h3 {
      margin: .55em 0 .25em;
    }

    .ProseMirror h1 { font-size: 1.85rem; }
    .ProseMirror h2 { font-size: 1.42rem; }
    .ProseMirror h3 { font-size: 1.16rem; }
    .ProseMirror p { margin: .55em 0; }

    :root[data-weibei-theme="inkstone"] .ProseMirror h1,
    :root[data-weibei-theme="inkstone"] .ProseMirror h2 {
      color: var(--blue-ink);
    }

    .ProseMirror a {
      color: var(--blue-ink);
      text-decoration-thickness: 1px;
      text-underline-offset: .18em;
    }

    .ProseMirror img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 1.1em 0;
      border: 1px solid var(--line);
    }

    .ProseMirror ul, .ProseMirror ol {
      padding-left: 1.45em;
      margin: .55em 0;
    }

    .ProseMirror li {
      margin: .18em 0;
      padding-left: .1em;
    }

    .ProseMirror li[data-item-type="task"] {
      position: relative;
      list-style: none;
      padding-left: 1.55em;
    }

    .ProseMirror li[data-item-type="task"]::before {
      content: "";
      position: absolute;
      left: .05em;
      top: .62em;
      width: .82em;
      height: .82em;
      box-sizing: border-box;
      border: 1px solid rgba(57, 95, 72, .34);
      background: var(--paper-raised);
    }

    .ProseMirror li[data-item-type="task"][data-checked="true"]::before {
      background: var(--moss);
      border-color: var(--moss);
      box-shadow: inset 0 0 0 2px var(--paper-raised);
    }

    .ProseMirror li[data-item-type="task"][data-checked="true"] > p,
    .ProseMirror li[data-item-type="task"][data-checked="true"] {
      color: var(--muted);
    }

    .ProseMirror s,
    .ProseMirror del {
      color: var(--faint);
      text-decoration-color: rgba(145, 38, 28, .42);
      text-decoration-thickness: 1px;
    }

    .ProseMirror table {
      width: 100%;
      margin: 1.05em 0;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: .96em;
      background: rgba(251, 245, 234, .52);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror table {
      background: rgba(255, 255, 255, .02);
    }

    .ProseMirror th,
    .ProseMirror td {
      border: 1px solid var(--line);
      padding: 7px 9px;
      vertical-align: top;
    }

    .ProseMirror th {
      color: var(--ink);
      background: rgba(92, 70, 46, .075);
      font-weight: 650;
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror th {
      color: var(--blue-ink);
      background: rgba(200, 185, 138, .08);
    }

    .ProseMirror td > p,
    .ProseMirror th > p {
      margin: 0;
      min-height: 1.55em;
    }

    .ProseMirror hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 1.6em 0;
    }

    .ProseMirror blockquote {
      margin: 1em 0;
      padding: .55em .9em;
      border-left: 3px solid rgba(92, 70, 46, .36);
      background: rgba(251, 245, 234, .48);
      color: var(--muted);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote {
      border-left-color: rgba(166, 54, 43, .55);
      background: rgba(166, 54, 43, .08);
      color: #c9bfa5;
    }

    .ProseMirror blockquote.weibei-callout {
      position: relative;
      padding: .72em 1em .72em 1.05em;
      border-left-width: 2px;
      background: var(--paper-raised);
      box-shadow: inset 0 0 0 1px rgba(92, 70, 46, .12);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout {
      background: rgba(255, 255, 255, .035);
      box-shadow: inset 0 0 0 1px rgba(45, 45, 45, .92);
    }

    .ProseMirror blockquote.weibei-callout::before {
      display: block;
      margin-bottom: .24em;
      font-size: .78em;
      letter-spacing: 0;
      color: var(--blue-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Songti SC", serif;
      font-weight: 650;
    }

    .ProseMirror blockquote.weibei-callout-tip,
    .ProseMirror blockquote.weibei-callout-success {
      border-left-color: var(--moss);
      background: rgba(63, 105, 82, .08);
    }
    .ProseMirror blockquote.weibei-callout-tip::before { color: var(--moss); }
    .ProseMirror blockquote.weibei-callout-success::before { color: var(--moss); }
    .ProseMirror blockquote.weibei-callout-important,
    .ProseMirror blockquote.weibei-callout-question,
    .ProseMirror blockquote.weibei-callout-example {
      border-left-color: var(--blue-ink);
      background: rgba(52, 91, 116, .075);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout-important,
    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout-question,
    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout-example {
      background: rgba(200, 185, 138, .07);
    }
    .ProseMirror blockquote.weibei-callout-important::before { color: var(--blue-ink); }
    .ProseMirror blockquote.weibei-callout-question::before { color: var(--blue-ink); }
    .ProseMirror blockquote.weibei-callout-example::before { color: var(--blue-ink); }
    .ProseMirror blockquote.weibei-callout-warning {
      border-left-color: var(--ochre);
      background: rgba(135, 97, 47, .08);
    }
    .ProseMirror blockquote.weibei-callout-warning::before {
      color: var(--ochre);
    }
    .ProseMirror blockquote.weibei-callout-summary {
      border-left-color: var(--moss);
      background: rgba(63, 105, 82, .08);
    }
    .ProseMirror blockquote.weibei-callout-abstract {
      border-left-color: var(--moss);
      background: rgba(63, 105, 82, .08);
    }
    .ProseMirror blockquote.weibei-callout-summary::before {
      color: var(--moss);
    }
    .ProseMirror blockquote.weibei-callout-abstract::before {
      color: var(--moss);
    }
    .ProseMirror blockquote.weibei-callout-caution,
    .ProseMirror blockquote.weibei-callout-danger,
    .ProseMirror blockquote.weibei-callout-failure,
    .ProseMirror blockquote.weibei-callout-bug {
      border-left-color: var(--cinnabar);
      background: var(--cinnabar-soft);
    }
    .ProseMirror blockquote.weibei-callout-caution::before { color: var(--cinnabar); }
    .ProseMirror blockquote.weibei-callout-danger::before { color: var(--cinnabar); }
    .ProseMirror blockquote.weibei-callout-failure::before { color: var(--cinnabar); }
    .ProseMirror blockquote.weibei-callout-bug::before { color: var(--cinnabar); }
    .ProseMirror blockquote.weibei-callout::before { content: attr(data-callout-title); }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout[data-callout-fold="-"] {
      cursor: pointer;
    }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout[data-callout-fold="-"] > * {
      display: none;
    }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout[data-callout-fold="-"].weibei-callout-open > * {
      display: revert;
    }

    body[data-editable="true"] .ProseMirror blockquote.weibei-callout.weibei-callout-has-heading::before {
      display: none;
    }

    .ProseMirror blockquote.weibei-callout .weibei-callout-heading {
      margin: 0 0 .34em;
      color: var(--blue-ink);
      font-size: .78em;
      font-weight: 650;
      letter-spacing: 0;
    }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout .weibei-callout-heading {
      display: none;
    }

    body[data-editable="false"] .ProseMirror blockquote.weibei-callout[data-callout-fold="-"].weibei-callout-open > .weibei-callout-heading {
      display: none;
    }

    .ProseMirror blockquote.weibei-callout[data-callout-title="阅读线索"] {
      margin: .76em 0;
      padding: .42em .72em .42em .86em;
      background: rgba(251, 245, 234, .18);
      box-shadow: none;
      border-left-color: rgba(145, 38, 28, .28);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror blockquote.weibei-callout[data-callout-title="阅读线索"] {
      background: rgba(166, 54, 43, .055);
      border-left-color: rgba(166, 54, 43, .38);
    }

    .ProseMirror blockquote.weibei-callout[data-callout-title="阅读线索"] .weibei-callout-heading {
      margin-bottom: .18em;
      color: var(--muted);
      font-size: .72em;
      font-weight: 620;
    }

    .ProseMirror blockquote.weibei-callout-tip .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-success .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-summary .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-abstract .weibei-callout-heading {
      color: var(--moss);
    }

    .ProseMirror blockquote.weibei-callout-warning .weibei-callout-heading {
      color: var(--ochre);
    }

    .ProseMirror blockquote.weibei-callout-caution .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-danger .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-failure .weibei-callout-heading,
    .ProseMirror blockquote.weibei-callout-bug .weibei-callout-heading {
      color: var(--cinnabar);
    }

    .ProseMirror code {
      font-family: "SF Mono", Menlo, ui-monospace, monospace;
      background: var(--code);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: .92em;
    }

    .ProseMirror pre {
      position: relative;
      padding: 14px 15px;
      border: 1px solid var(--line);
      background: var(--code-paper);
      overflow: auto;
      line-height: 1.62;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .30);
    }

    :root[data-weibei-theme="inkstone"] .ProseMirror pre {
      box-shadow: none;
    }

    .ProseMirror pre[data-language]::before {
      content: attr(data-language);
      position: absolute;
      top: 6px;
      right: 10px;
      color: var(--faint);
      font: 10px/1.4 "SF Mono", Menlo, ui-monospace, monospace;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .ProseMirror pre[data-language=""]::before {
      content: none;
    }

    .ProseMirror pre code {
      display: block;
      padding: 0;
      background: transparent;
      border-radius: 0;
      font-size: .88em;
      color: var(--ink);
    }

    .ProseMirror pre .token.comment,
    .ProseMirror pre .token.prolog,
    .ProseMirror pre .token.doctype,
    .ProseMirror pre .token.cdata {
      color: var(--faint);
    }

    .ProseMirror pre .token.punctuation {
      color: var(--muted);
    }

    .ProseMirror pre .token.keyword,
    .ProseMirror pre .token.operator,
    .ProseMirror pre .token.atrule {
      color: var(--cinnabar);
    }

    .ProseMirror pre .token.string,
    .ProseMirror pre .token.char,
    .ProseMirror pre .token.attr-value {
      color: var(--moss);
    }

    .ProseMirror pre .token.function,
    .ProseMirror pre .token.class-name,
    .ProseMirror pre .token.selector {
      color: var(--blue-ink);
    }

    .ProseMirror pre .token.number,
    .ProseMirror pre .token.boolean,
    .ProseMirror pre .token.constant,
    .ProseMirror pre .token.property,
    .ProseMirror pre .token.symbol {
      color: var(--ochre);
    }

    .ProseMirror pre .token.regex,
    .ProseMirror pre .token.important,
    .ProseMirror pre .token.variable {
      color: var(--violet-ink);
    }

    .ProseMirror sup {
      color: var(--blue-ink);
      font-size: .72em;
    }

    .ProseMirror .footnote-definition,
    .ProseMirror [data-type="footnote-definition"] {
      color: var(--muted);
      font-size: .9em;
    }

    .weibei-highlight {
      background: rgba(145, 38, 28, .14);
      box-shadow: 0 .08em 0 rgba(145, 38, 28, .18);
      padding: 0 .05em;
    }

    :root[data-weibei-theme="inkstone"] .weibei-highlight {
      background: rgba(166, 54, 43, .28);
      box-shadow: 0 .08em 0 rgba(166, 54, 43, .24);
      color: #f0d6b0;
    }

    .weibei-wikilink {
      color: var(--blue-ink);
      background: rgba(49, 86, 107, .085);
      border-bottom: 1px solid rgba(49, 86, 107, .34);
      padding: 0 .08em;
      cursor: pointer;
    }

    :root[data-weibei-theme="inkstone"] .weibei-wikilink {
      background: rgba(200, 185, 138, .08);
      border-bottom-color: rgba(200, 185, 138, .55);
    }

    .weibei-source-reference {
      color: var(--blue-ink);
      border-bottom: 1px dotted rgba(49, 86, 107, .38);
      cursor: pointer;
    }

    button.weibei-source-reference {
      appearance: none;
      border: 0;
      border-bottom: 1px dotted rgba(49, 86, 107, .38);
      border-radius: 0;
      padding: 0;
      background: transparent;

    .ProseMirror .weibei-interactive-comparison-matrix {
      padding: 9px 0;
      border-width: 1px 0;

    .weibei-relationship-nodes {
      position: relative;
      gap: 10px;
    }

    .weibei-interactive-relationship-map[data-layout="radial"] .weibei-relationship-nodes {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: center;
    }

    .weibei-interactive-relationship-map[data-layout="radial"] .weibei-relationship-nodes::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 28% 8%;

      border-bottom: 1px solid rgba(29, 24, 20, .16);

    .weibei-interactive-relationship-map[data-layout="radial"] .weibei-relationship-node[data-role="center"] {

      grid-row: 1 / span 2;
      min-height: 74px;
      place-self: center stretch;
      border: 2px solid var(--cinnabar);
      background: var(--cinnabar-soft);
      color: var(--cinnabar);
      text-align: center;
    }

    .weibei-interactive-relationship-map[data-layout="flow"] .weibei-relationship-nodes {
      grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
      gap: 18px;
    }

    .weibei-interactive-relationship-map[data-layout="flow"] .weibei-relationship-nodes::before {
      left: 4%;
      right: 4%;
      border-top-color: rgba(29, 24, 20, .28);
    }

    .weibei-relationship-node {
      padding: 8px;
      border-width: 1px 0 0;
      border-radius: 0;
      background: rgba(255, 251, 241, .20);
      box-shadow: inset 0 2px 0 var(--weibei-interactive-tone, var(--cinnabar));
    }

    .weibei-relationship-edges {
      gap: 4px 10px;
      padding-top: 7px;
      border-top: 1px dotted rgba(92, 70, 46, .20);
    }

    .weibei-relationship-edge {
      grid-template-columns: auto auto auto minmax(0, auto);
      border-bottom: 1px solid rgba(92, 70, 46, .12);
    }

    .weibei-timeline-events {
      position: relative;
      gap: 0;
      padding-top: 14px;
    }

    .weibei-timeline-events::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 0;
      right: 0;
      border-top: 2px solid rgba(145, 38, 28, .32);
    }

    .weibei-timeline-event {
      padding: 8px 9px 7px;
      border-width: 0 1px 0 0;
      border-color: rgba(92, 70, 46, .18);
      background: transparent;
    }

    .weibei-timeline-event::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 9px;
      width: 7px;
      height: 7px;
      border: 1px solid var(--cinnabar);
      border-radius: 2px;
      background: var(--paper);
    }

    .weibei-comparison-table {
      border-collapse: separate;
      border-spacing: 0;
      border-top: 2px solid rgba(92, 70, 46, .34);
      border-bottom: 2px solid rgba(92, 70, 46, .28);
      font-size: 12px;
    }

    .weibei-comparison-table th,
    .weibei-comparison-table td {
      border-width: 0 0 1px;
      border-color: rgba(92, 70, 46, .20);
      background: transparent;
    }

    .weibei-comparison-table th + th,
    .weibei-comparison-table td + td {
      border-left: 1px solid rgba(92, 70, 46, .14);
    }

    .weibei-comparison-row-label {
      width: 24%;
      color: var(--ochre);
    }

    .weibei-comparison-column-button {
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
    }

    .weibei-comparison-column-button[aria-pressed="true"] {
      border-bottom-color: var(--cinnabar);
      background: transparent;
    }

    .weibei-comparison-cell.is-focused-column {
      background: rgba(145, 38, 28, .08);
    }

    .weibei-comparison-cell.is-emphasized {
      box-shadow: inset 3px 0 0 var(--cinnabar);
    }

    .weibei-annotated-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(96px, .34fr);
      gap: 10px;
      align-items: start;
    }

    .weibei-annotation-margin {
      display: grid;
      gap: 8px;
      padding-left: 8px;
      border-left: 1px dotted rgba(92, 70, 46, .28);
    }

    .weibei-interactive-derivation {
      padding: 8px 0;
      border-width: 1px 0;
      border-style: solid;
      border-color: rgba(92, 70, 46, .18);
    }

    .weibei-derivation-progress {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));
      gap: 4px;
      margin-top: 8px;
      border-bottom: 1px solid rgba(92, 70, 46, .18);
    }

    .weibei-derivation-prompt {
      margin-top: 6px;
      color: var(--muted);
      line-height: 1.55;
    }

    .weibei-derivation-steps {
      display: grid;
      gap: 0;
    }

    .weibei-derivation-step {
      padding: 6px 0 7px;
      border-bottom: 1px solid transparent;
      color: var(--muted);
    }

    .weibei-derivation-step.is-active {
      border-bottom-color: var(--cinnabar-line);
      background: transparent;
    }

    .weibei-derivation-label {
      color: var(--ochre);
      font: 600 10px/1.35 "SF Mono", Menlo, ui-monospace, monospace;
    }

    .weibei-derivation-statement {
      margin-top: 3px;
      color: var(--ink);
      font-weight: 650;
    }

    .weibei-derivation-reason {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .weibei-derivation-controls,
    .weibei-flashcard-controls,
    .weibei-sequence-controls,
    .weibei-scenario-controls,
    .weibei-decision-choices {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .weibei-interactive-flashcards {
      padding: 8px 0;
      border-width: 1px 0;
      border-style: solid;
      border-color: rgba(92, 70, 46, .18);
    }

    .weibei-flashcard-stage {
      margin-top: 8px;
    }

    .weibei-flashcard-status {
      margin-top: 4px;
      color: var(--faint);
      font: 10px/1.35 "SF Mono", Menlo, ui-monospace, monospace;
      text-align: right;
    }

    .weibei-flashcard {
      appearance: none;
      width: 100%;
      position: relative;
      min-height: 118px;
      border: 1px solid rgba(92, 70, 46, .24);
      border-radius: 4px;
      background: rgba(255, 251, 241, .22);
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
    }

    .weibei-flashcard-front,
    .weibei-flashcard-back {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12px;
      transition: opacity .18s ease-out, transform .18s ease-out;
    }

    .weibei-flashcard-front {
      visibility: visible;
      opacity: 1;
      transform: translateX(0);
    }

    .weibei-flashcard-back {
      visibility: hidden;
      opacity: 0;
      transform: translateX(10px);
      border-left: 2px solid var(--cinnabar-line);
    }

    .weibei-flashcard.is-flipped .weibei-flashcard-front {
      visibility: hidden;
      opacity: 0;
      transform: translateX(-10px);
    }

    .weibei-flashcard.is-flipped .weibei-flashcard-back {
      visibility: visible;
      opacity: 1;
      transform: translateX(0);
    }

    .weibei-interactive-sequence-builder {
      padding: 8px 0;
      border-width: 1px 0;
      border-style: solid;
      border-color: rgba(92, 70, 46, .18);
    }

    .weibei-sequence-instruction {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .weibei-sequence-pool,
    .weibei-sequence-answer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 6px;
      margin-top: 8px;
      padding: 7px;
      border: 1px solid rgba(92, 70, 46, .16);
    }

    .weibei-sequence-answer {
      border-style: dashed;
      background: rgba(145, 38, 28, .045);
    }

    .weibei-sequence-item,
    .weibei-scenario-option,
    .weibei-decision-choice {
      appearance: none;
      width: 100%;
      padding: 7px 8px;
      border: 1px solid rgba(92, 70, 46, .20);
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
    }

    .weibei-sequence-feedback {
      margin-top: 7px;
      padding-left: 8px;
      border-left: 2px solid var(--cinnabar-line);
      color: var(--muted);
    }

    .weibei-sequence-item-label,
    .weibei-sequence-item-detail {
      display: block;
    }

    .weibei-sequence-item-label {
      color: var(--ink);
      font-weight: 650;
    }

    .weibei-sequence-item-detail {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .weibei-interactive-scenario-lab,
    .weibei-interactive-evidence-board,
    .weibei-interactive-spectrum,
    .weibei-interactive-decision-path {
      padding: 8px 0;
      border-width: 1px 0;
      border-style: solid;
      border-color: rgba(92, 70, 46, .18);
    }

    .weibei-scenario-layout {
      display: grid;
      grid-template-columns: minmax(0, .42fr) minmax(0, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .weibei-scenario-control {
      padding-bottom: 8px;
      border-bottom: 1px dotted rgba(92, 70, 46, .22);
    }

    .weibei-scenario-controls {
      display: grid;
      gap: 8px;
      margin-top: 0;
    }

    .weibei-scenario-control-label {
      margin-bottom: 5px;
      color: var(--ochre);
      font-size: 11px;
      font-weight: 650;
    }

    .weibei-scenario-result {
      padding: 9px 0 9px 10px;
      border-left: 2px solid var(--cinnabar-line);
      color: var(--ink);
    }

    .weibei-scenario-result-title {
      font-weight: 650;
    }

    .weibei-scenario-result-body {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .weibei-evidence-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(92, 70, 46, .18);
    }

    .weibei-evidence-claim {
      margin-top: 5px;
      color: var(--ink);
      font-weight: 650;
    }

    .weibei-evidence-filter {
      appearance: none;
      padding: 4px 7px;
      border: 1px solid rgba(92, 70, 46, .22);
      border-radius: 3px;
      background: transparent;
      color: var(--muted);
      font: inherit;
    }

    .weibei-evidence-list {
      display: grid;
      gap: 0;
      margin-top: 8px;
      border-top: 1px solid rgba(92, 70, 46, .18);
    }

    .weibei-evidence-item {
      appearance: none;
      width: 100%;
      padding: 7px 8px;
      border-width: 0 0 1px 2px;
      border-bottom: 1px solid rgba(92, 70, 46, .16);
      border-left-color: var(--weibei-interactive-tone, var(--line));
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .weibei-evidence-item-title,
    .weibei-evidence-detail-title {
      color: var(--ink);
      font-weight: 650;
    }

    .weibei-evidence-detail-body {
      margin-top: 3px;
    }

    .weibei-evidence-detail {
      margin-top: 8px;
      padding: 8px 0 0 9px;
      border-left: 2px solid var(--cinnabar-line);
      color: var(--muted);
    }

    .weibei-spectrum-track {
      position: relative;
      min-height: 58px;
      margin: 18px 22px 0;
      border-top: 2px solid rgba(92, 70, 46, .30);
    }

    .weibei-spectrum-track::before,
    .weibei-spectrum-track::after {
      position: absolute;
      top: -17px;
      color: var(--faint);
      font-size: 10px;
      content: attr(data-start);
    }

    .weibei-spectrum-track::before {
      left: -22px;
    }

    .weibei-spectrum-track::after {
      right: -22px;
      content: attr(data-end);
    }

    .weibei-spectrum-marker {
      position: absolute;
      top: -8px;
      width: auto;
      min-width: 44px;
      height: 42px;
      padding: 17px 3px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font: 10px/1.2 -apple-system, BlinkMacSystemFont, "Songti SC", serif;
      transform: translateX(-50%);
      cursor: pointer;
    }

    .weibei-spectrum-marker::before {
      position: absolute;
      top: 0;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 1px solid var(--weibei-interactive-tone, var(--cinnabar));
      border-radius: 2px;
      background: var(--paper);
      content: "";
      transform: translateX(-50%);
    }

    .weibei-spectrum-marker.is-active {
      color: var(--ink);
      font-weight: 650;
    }

    .weibei-spectrum-marker.is-active::before {
      background: var(--weibei-interactive-tone, var(--cinnabar));
    }

    .weibei-spectrum-detail {
      margin-top: 8px;
      padding-left: 8px;
      border-left: 1px dotted rgba(92, 70, 46, .28);
      color: var(--muted);
    }

    .weibei-spectrum-detail-title,
    .weibei-decision-node-title {
      color: var(--ink);
      font-weight: 650;
    }

    .weibei-spectrum-detail-body,
    .weibei-decision-node-body {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .weibei-decision-trail {
      display: grid;
      gap: 0;
      margin-top: 8px;
      border-left: 2px solid rgba(145, 38, 28, .30);

    .weibei-decision-node {
      padding: 8px 0 8px 10px;
      border-bottom: 1px solid rgba(92, 70, 46, .16);
    }

    .weibei-decision-reset {
      color: var(--faint);
    }

    .weibei-reaction-title,
    .weibei-algorithm-title,
    .weibei-language-title,
    .weibei-argument-title,

    .weibei-interactive-language-aligner button:focus-visible,

    .weibei-unit-question {

      line-height: 1.55;

    .weibei-unit-variables {

      border-top: 2px solid rgba(92, 70, 46, .30);
      border-bottom: 1px solid rgba(92, 70, 46, .22);
    }

    .weibei-unit-variable {
      display: grid;
      grid-template-columns: minmax(72px, 1fr) minmax(86px, auto) minmax(90px, .8fr);
      gap: 8px;
      align-items: baseline;
      min-width: 0;
      padding: 6px 4px;
      border: 0;
      border-bottom: 1px dotted rgba(92, 70, 46, .20);
      background: transparent;
      text-align: left;

    .weibei-unit-variable:last-child {
      border-bottom: 0;

    .weibei-unit-variable-label,
    .weibei-unit-check-label {

      font-weight: 650;
    }

    .weibei-unit-variable-value,
    .weibei-unit-check-chain {
      color: var(--ink);
      font: 600 12px/1.45 "SF Mono", Menlo, ui-monospace, monospace;
      overflow-wrap: anywhere;
    }

    .weibei-unit-variable-role {
      color: var(--faint);
      font-size: 11px;
      text-align: right;
    }

    .weibei-unit-checks {

      grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
      gap: 1px;
      margin-top: 8px;
      border: 1px solid rgba(92, 70, 46, .18);

      padding: 7px 8px;

      border-left: 2px solid rgba(57, 95, 72, .58);
      background: transparent;
      text-align: left;

    .weibei-unit-detail,
    .weibei-reaction-source,
    .weibei-language-note,
    .weibei-argument-detail,
    .weibei-visual-analysis-detail,
    .weibei-spatial-detail,

    .weibei-unit-detail-title,
    .weibei-argument-detail-label,
    .weibei-visual-analysis-zone-title,
    .weibei-spatial-detail-title,

    .weibei-unit-detail-body,
    .weibei-unit-detail-note,
    .weibei-argument-detail-body,
    .weibei-visual-analysis-zone-note,
    .weibei-spatial-detail-note,
    .weibei-pathway-state-note,

    .weibei-reaction-equation {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      margin-top: 9px;

      text-align: center;

      text-align: center;

      grid-template-columns: repeat(auto-fit, minmax(86px, 1fr));

      border-bottom: 1px solid rgba(92, 70, 46, .18);

      gap: 6px;
      padding: 6px 8px;

      font-weight: 700;

      align-items: start;
    }

    .weibei-algorithm-title,
    .weibei-interactive-algorithm-trace > .weibei-interactive-source-row {
      grid-column: 1 / -1;
    }

    .weibei-algorithm-code {
      grid-column: 1;
      grid-row: 2 / span 3;
      min-width: 0;
      margin: 0;
      padding: 8px 8px 8px 34px;
      border: 1px solid rgba(92, 70, 46, .22);
      border-left: 3px solid rgba(29, 24, 20, .52);
      border-radius: 2px;
      background: rgba(29, 24, 20, .035);
      color: var(--muted);
      font: 11px/1.62 "SF Mono", Menlo, ui-monospace, monospace;
      overflow-x: auto;
    }

    .weibei-algorithm-line {
      min-height: 18px;
      padding: 1px 4px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .weibei-algorithm-line.is-active {
      background: var(--cinnabar-soft);
      color: var(--ink);
      box-shadow: inset 2px 0 0 var(--cinnabar);
    }

    .weibei-algorithm-step {
      grid-column: 2;
      min-height: 72px;
      padding: 8px 0 8px 9px;
      border-left: 2px solid var(--cinnabar-line);
    }

    .weibei-algorithm-step-title {
      color: var(--ink);
      font-weight: 650;
      line-height: 1.48;
    }

    .weibei-algorithm-step-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .weibei-algorithm-progress {
      grid-column: 2;
      color: var(--faint);
      font: 10px/1.3 "SF Mono", Menlo, ui-monospace, monospace;
      text-align: right;
    }

    .weibei-algorithm-controls {
      grid-column: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .weibei-algorithm-action {
      min-height: 27px;
      padding: 4px 7px;
      border: 1px solid rgba(92, 70, 46, .22);
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
    }

    .weibei-algorithm-action:disabled {
      cursor: default;
      opacity: .36;
    }

    .weibei-language-pairs {
      display: grid;
      margin-top: 8px;
      border-top: 2px solid rgba(92, 70, 46, .30);
      border-bottom: 1px solid rgba(92, 70, 46, .20);
    }

    .weibei-language-pair {
      display: grid;
      grid-template-columns: minmax(52px, .28fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      min-width: 0;
      padding: 8px 4px;
      border: 0;
      border-bottom: 1px solid rgba(92, 70, 46, .16);
      background: transparent;
      text-align: left;
    }

    .weibei-language-pair:last-child {
      border-bottom: 0;
    }

    .weibei-language-pair-label {
      color: var(--ochre);
      font: 600 10px/1.45 "SF Mono", Menlo, ui-monospace, monospace;
    }

    .weibei-language-source-text,
    .weibei-language-target-text {
      min-width: 0;
      color: var(--ink);
      line-height: 1.58;
      overflow-wrap: anywhere;
    }

    .weibei-language-target-text {
      padding-left: 8px;
      border-left: 1px dotted rgba(92, 70, 46, .28);
    }

    .weibei-language-note-source,
    .weibei-language-note-target {
      display: inline;
      color: var(--ink);
    }

    .weibei-language-note-source::after {
      margin: 0 6px;
      color: var(--cinnabar);
      content: "→";
    }

    .weibei-language-note-body {
      margin-top: 4px;
    }

    .weibei-argument-question {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .weibei-argument-nodes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
      gap: 0;
      margin-top: 9px;
      border-top: 2px solid rgba(92, 70, 46, .30);
      border-bottom: 1px solid rgba(92, 70, 46, .20);
    }

    .weibei-argument-node {
      display: grid;
      align-content: start;
      gap: 4px;
      min-height: 72px;
      padding: 8px;
      border: 0;
      border-right: 1px solid rgba(92, 70, 46, .16);
      border-top: 3px solid var(--line);
      background: transparent;
      text-align: left;
    }

    .weibei-argument-node[data-argument-type="claim"] {
      border-top-color: var(--cinnabar);
    }

    .weibei-argument-node[data-argument-type="premise"] {
      border-top-color: rgba(57, 95, 72, .72);
    }

    .weibei-argument-node[data-argument-type="objection"] {
      border-top-color: var(--ochre);
    }

    .weibei-argument-node[data-argument-type="reply"] {
      border-top-color: var(--blue-ink);
    }

    .weibei-argument-node-type,
    .weibei-argument-detail-type {
      color: var(--faint);
      font: 600 9px/1.3 "SF Mono", Menlo, ui-monospace, monospace;
      text-transform: uppercase;
    }

    .weibei-argument-node-label {
      color: var(--ink);
      font-size: 12px;
      font-weight: 630;
      line-height: 1.48;
    }

    .weibei-argument-edges,
    .weibei-pathway-edges {
      display: grid;
      gap: 0;
      margin-top: 7px;
      border-top: 1px dotted rgba(92, 70, 46, .22);
    }

    .weibei-argument-edge,
    .weibei-pathway-edge {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) minmax(0, .8fr);
      gap: 6px;
      align-items: baseline;
      padding: 5px 2px;
      border-bottom: 1px solid rgba(92, 70, 46, .12);
      color: var(--muted);
      font-size: 10px;
    }

    .weibei-argument-edge-arrow,
    .weibei-pathway-edge-arrow {
      color: var(--cinnabar);
    }

    .weibei-argument-edge-label,
    .weibei-pathway-edge-label {
      color: var(--ochre);
      text-align: right;
    }

    .weibei-interactive-visual-analysis,
    .weibei-interactive-spatial-layers {
      display: grid;
      grid-template-columns: minmax(168px, 1.08fr) minmax(118px, .92fr);
      gap: 8px 12px;
      align-items: start;
    }

    .weibei-visual-analysis-title,
    .weibei-spatial-title,
    .weibei-interactive-visual-analysis > .weibei-interactive-source-row,
    .weibei-interactive-spatial-layers > .weibei-interactive-source-row {
      grid-column: 1 / -1;
    }

    .weibei-visual-analysis-surface,
    .weibei-spatial-surface {
      grid-column: 1;
      grid-row: 2 / span 4;
      display: block;
      width: 100%;
      min-height: 0;
      aspect-ratio: 3 / 2;
      border: 1px solid rgba(92, 70, 46, .22);
      background-color: rgba(255, 251, 241, .13);
      box-shadow: inset 0 0 0 4px rgba(92, 70, 46, .035);
    }

    .weibei-visual-analysis-zone {
      stroke: rgba(29, 24, 20, .50);
      stroke-width: .7;
      fill-opacity: .22;
      transition: fill-opacity .16s ease-out, opacity .16s ease-out, stroke-width .16s ease-out;
    }

    .weibei-visual-analysis-zone.is-active {
      stroke: var(--cinnabar);
      stroke-width: 1.6;
      fill-opacity: .55;
    }

    .weibei-visual-analysis-lenses,
    .weibei-spatial-toolbar,
    .weibei-pathway-states {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(92, 70, 46, .18);
    }

    .weibei-visual-analysis-lens,
    .weibei-spatial-layer-toggle,
    .weibei-pathway-state {
      min-height: 25px;
      padding: 3px 7px;
      border: 1px solid rgba(92, 70, 46, .22);
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
    }

    .weibei-visual-analysis-zones,
    .weibei-spatial-features {
      display: grid;
      gap: 0;
      border-top: 1px solid rgba(92, 70, 46, .15);
    }

    .weibei-visual-analysis-zone-button,
    .weibei-spatial-feature {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 6px;
      align-items: baseline;
      min-width: 0;
      padding: 6px 3px;
      border: 0;
      border-bottom: 1px dotted rgba(92, 70, 46, .20);
      background: transparent;
      text-align: left;
    }

    .weibei-spatial-feature-type {
      color: var(--faint);
      font: 600 9px/1.3 "SF Mono", Menlo, ui-monospace, monospace;
      text-transform: uppercase;
    }

    .weibei-visual-analysis-palette {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(76px, 1fr));
      gap: 5px;
    }

    .weibei-visual-analysis-palette-item {
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr);
      gap: 5px;
      align-items: center;
      min-width: 0;
      padding: 4px;
      border: 1px solid rgba(92, 70, 46, .18);
      border-radius: 2px;
      background: transparent;
      text-align: left;
    }

    .weibei-visual-analysis-palette-item::before {
      grid-row: 1 / span 2;
      width: 8px;
      height: 28px;
      background: var(--weibei-interactive-tone, var(--ink));
      content: "";
    }

    .weibei-visual-analysis-palette-label {
      color: var(--ink);
      font-size: 10px;
      font-weight: 650;
    }

    .weibei-visual-analysis-palette-role {
      color: var(--faint);
      font-size: 9px;
    }

    .weibei-spatial-layer {
      transition: opacity .16s ease-out;
    }

    .weibei-spatial-layer.is-hidden-layer {
      opacity: 0;
    }

    .weibei-spatial-point {
      fill: var(--cinnabar);
      stroke: var(--paper);
      stroke-width: .8;
    }

    .weibei-spatial-route {
      stroke: var(--blue-ink);
      stroke-width: 1.6;
      stroke-dasharray: 3 2;
    }

    .weibei-spatial-region {
      fill: rgba(142, 102, 44, .18);
      stroke: var(--ochre);
      stroke-width: .8;
    }

    .weibei-interactive-pathway-lab {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(118px, .38fr);
      gap: 8px 12px;
      align-items: start;
    }

    .weibei-pathway-title,
    .weibei-pathway-states,
    .weibei-interactive-pathway-lab > .weibei-interactive-source-row {
      grid-column: 1 / -1;
    }

    .weibei-pathway-map {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 14px 20px;
      padding: 12px 0;
      border-top: 1px solid rgba(92, 70, 46, .18);
      border-bottom: 1px solid rgba(92, 70, 46, .18);
    }

    .weibei-pathway-map::before {
      position: absolute;
      top: 50%;
      left: 4%;
      right: 4%;
      border-top: 1px solid rgba(92, 70, 46, .30);
      content: "";
    }

    .weibei-pathway-node {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 3px;
      min-height: 54px;
      padding: 7px;
      border: 1px solid rgba(92, 70, 46, .24);
      border-radius: 2px;
      background: var(--paper);
      text-align: left;
    }

    .weibei-pathway-node.is-active {
      border-color: rgba(57, 95, 72, .62);
      background: rgba(57, 95, 72, .09);
      box-shadow: inset 0 3px 0 rgba(57, 95, 72, .62);
    }

    .weibei-pathway-node-label {
      color: var(--ink);
      font-weight: 650;
    }

    .weibei-pathway-node-detail {
      color: var(--faint);
      font-size: 10px;
      line-height: 1.4;
    }

    .weibei-pathway-edges,
    .weibei-pathway-detail {
      grid-column: 2;
    }

    :root[data-weibei-theme="inkstone"] .weibei-algorithm-code,
    :root[data-weibei-theme="inkstone"] .weibei-visual-analysis-surface,
    :root[data-weibei-theme="inkstone"] .weibei-spatial-surface {
      background-color: rgba(255, 255, 255, .025);
      border-color: rgba(200, 185, 138, .18);
    }

    :root[data-weibei-theme="inkstone"] .weibei-pathway-node {
      background: var(--paper);
      border-color: rgba(200, 185, 138, .20);
    }

    :root[data-weibei-theme="inkstone"] .weibei-interactive :where(.is-active, [aria-selected="true"], [aria-pressed="true"]),
    :root[data-weibei-theme="inkstone"] .weibei-study-board-item,
    :root[data-weibei-theme="inkstone"] .weibei-relationship-node,
    :root[data-weibei-theme="inkstone"] .weibei-flashcard,
    :root[data-weibei-theme="inkstone"] .weibei-sequence-pool,
    :root[data-weibei-theme="inkstone"] .weibei-sequence-answer,
    :root[data-weibei-theme="inkstone"] .weibei-sequence-item,
    :root[data-weibei-theme="inkstone"] .weibei-scenario-option,
    :root[data-weibei-theme="inkstone"] .weibei-evidence-filter,
    :root[data-weibei-theme="inkstone"] .weibei-decision-choice {
      background: rgba(255, 255, 255, .025);
      border-color: rgba(200, 185, 138, .18);
    }

    :root[data-weibei-theme="inkstone"] .weibei-interactive-study-board[data-layout="grid"] .weibei-study-board-items {
      background: transparent;
    }

    :root[data-weibei-theme="inkstone"] .weibei-timeline-event::before,
    :root[data-weibei-theme="inkstone"] .weibei-spectrum-marker::before,
    :root[data-weibei-theme="inkstone"] .weibei-interactive-study-board[data-layout="sequence"] .weibei-study-board-item::before {
      background: var(--paper);
    }

    @media (max-width: 420px) {
      .weibei-interactive {
        margin: .74em 0;
        max-width: 100%;
      }

      .weibei-interactive-chart,
      .weibei-interactive-function,
      .weibei-interactive-parameter,
      .weibei-annotated-layout,
      .weibei-scenario-layout,
      .weibei-interactive-algorithm-trace,
      .weibei-interactive-visual-analysis,
      .weibei-interactive-spatial-layers,
      .weibei-interactive-pathway-lab {
        grid-template-columns: 1fr;
      }

      .weibei-algorithm-title,
      .weibei-algorithm-code,
      .weibei-algorithm-step,
      .weibei-algorithm-progress,
      .weibei-algorithm-controls,
      .weibei-visual-analysis-title,
      .weibei-visual-analysis-surface,
      .weibei-spatial-title,
      .weibei-spatial-surface,
      .weibei-pathway-title,
      .weibei-pathway-states,
      .weibei-pathway-map,
      .weibei-pathway-edges,
      .weibei-pathway-detail {
        grid-column: 1;
        grid-row: auto;
      }

      .weibei-language-pair,
      .weibei-unit-variable {
        grid-template-columns: 1fr;
      }

      .weibei-language-target-text,
      .weibei-unit-variable-role {
        padding-left: 8px;
        border-left: 1px dotted rgba(92, 70, 46, .24);
        text-align: left;
      }

      .weibei-reaction-equation {
        grid-template-columns: 1fr;
      }

      .weibei-reaction-products {
        justify-content: flex-start;
      }

      .weibei-reaction-arrow {
        transform: rotate(90deg);
      }

      .weibei-chart-legend,
      .weibei-function-formula,
      .weibei-parameter-controls,
      .weibei-annotation-margin {
        grid-column: auto;
        padding-left: 0;
        border-left: 0;
        border-top: 1px dotted rgba(92, 70, 46, .24);
        padding-top: 7px;
      }

      .weibei-interactive-relationship-map[data-layout="radial"] .weibei-relationship-nodes {
        grid-template-columns: 1fr;
      }

      .weibei-interactive-relationship-map[data-layout="radial"] .weibei-relationship-node[data-role="center"] {
        grid-column: auto;
        grid-row: auto;
      }

      .weibei-interactive-study-board[data-layout="grid"] .weibei-study-board-items,
      .weibei-sequence-pool,
      .weibei-sequence-answer {
        grid-template-columns: 1fr;
      }

      .weibei-timeline-events::before {
        top: 0;
        bottom: 0;
        left: 5px;
        right: auto;
        border-top: 0;
        border-left: 2px solid rgba(145, 38, 28, .32);
      }

      .weibei-timeline-event {
        padding-left: 18px;
        border-right: 0;
        border-bottom: 1px solid rgba(92, 70, 46, .16);
      }

      .weibei-timeline-event::before {
        top: 10px;
        left: 1px;
      }

      .weibei-comparison-table {
        table-layout: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .weibei-interactive * {
        transition: none;
      }

    }

    .weibei-image {
      border: 1px solid var(--line);
      background: rgba(255, 251, 241, .32);
      padding: 4px;
    }

    :root[data-weibei-theme="inkstone"] .weibei-image {
      background: rgba(255, 255, 255, .035);
    }

    .weibei-uploading {
      display: inline-block;
      padding: 2px 7px;
      color: var(--muted);
      border: 1px solid var(--line);
      background: rgba(255, 251, 241, .42);
      font-size: .88em;
    }

    :root[data-weibei-theme="inkstone"] .weibei-uploading {
      background: rgba(255, 255, 255, .035);
    }

    .ProseMirror-focused {
      outline: none;
    }

    .editor-status {
      max-width: 760px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .editor-status.error {
      color: var(--cinnabar);
      font-family: "SF Mono", Menlo, ui-monospace, monospace;
      white-space: pre-wrap;
    }
  </style>
  <link rel="stylesheet" href="./answer-design.css">
</head>
<body>
  <main id="editor">
    <section id="frontmatter-panel" aria-label="Markdown Properties"></section>
    <div id="editor-status" class="editor-status">正在载入魏碑写作内核...</div>
  </main>
  <script>
    window.WeiBeiEditorBootFailed = function(error) {
      var root = document.querySelector('#editor');
      if (!root) return;
      var text = error && (error.stack || error.message) ? (error.stack || error.message) : String(error);
      root.innerHTML = '<pre class="editor-status error">Milkdown 初始化失败\n' + text.replace(/[<>&]/g, function(ch) {
        return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch];
      }) + '</pre>';
    };
    window.addEventListener('error', function(event) {
      window.WeiBeiEditorBootFailed(event.error || event.message);
    });
    window.addEventListener('unhandledrejection', function(event) {
      window.WeiBeiEditorBootFailed(event.reason);
    });
  </script>
  <script src="./editor.js"></script>
</body>
</html>
