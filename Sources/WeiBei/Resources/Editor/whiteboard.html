<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-/Q7VUHZ+U6FCYUsHCtl/w3Is/xwvhiqHP86ympq/1/A=' 'sha256-v/zJFsgJHxx/72F28ZtDAisaKyjCM2mXTAr/pznK3qQ=' 'sha256-KvxvCgBt77BbFD12RSVlaWP6vz0UX1fVZgHlW7shJEw=' 'sha256-q+LvCbyA66qYS3pM3vbehLB36+2OxWWRUpAqzKRi3GA='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src data:; connect-src 'none'; frame-src 'none'">
<link rel="stylesheet" href="editor.css">
<style>
@font-face{font-family:Virgil;src:url("Virgil.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{color-scheme:light;--paper:#faf8f2;--ink:#36332e;--muted:#8d8679;--dot:#d9d3c7;--definition:#28668d;--formula:#765198;--example:#43765c;--diagram:#b56d34;--red:#b54636;--hand:"Virgil","Kaiti SC","STKaiti",serif}
:root[data-theme=dark]{color-scheme:dark;--paper:#242421;--ink:#e7e2d7;--muted:#a7a092;--dot:#45433c;--definition:#91bbd3;--formula:#bf9ed6;--example:#98bda2;--diagram:#e3b27f;--red:#df9481}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:var(--hand);color:var(--ink);background:var(--paper)}
#viewport{position:absolute;inset:0 var(--webi-width,156px) 0 0;overflow:auto;background-image:radial-gradient(var(--dot) .65px,transparent .65px);background-size:20px 20px}
#webi-host{position:fixed;right:6px;bottom:12px;width:144px;z-index:9}
#generation-waiting{position:fixed;right:8px;bottom:190px;width:140px;font-size:14px;line-height:1.7;text-align:center;color:var(--muted)}
#canvas{position:relative;min-height:100%}.card{position:absolute;padding:4px 12px 8px;--type-color:var(--definition)}
.card.formula{--type-color:var(--formula)}.card.example{--type-color:var(--example)}.card.diagram{--type-color:var(--diagram)}.card.summary{--type-color:var(--ink)}
.page-title{font-size:14px;color:var(--muted);letter-spacing:.08em}
.card>h2{font:400 23px/1.55 var(--hand);text-align:center;color:var(--type-color);margin:0 0 16px}
.title-marker{padding:0 .12em;background-image:linear-gradient(transparent 62%,color-mix(in srgb,var(--type-color) 21%,transparent) 62%,color-mix(in srgb,var(--type-color) 21%,transparent) 97%,transparent 97%);background-repeat:no-repeat;background-size:0% 100%;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.content{font:400 19px/1.8 var(--hand);overflow-wrap:anywhere;text-align:left}.content p{margin:.35em 0}.content pre{overflow:auto}.content table{border-collapse:collapse;width:100%;font-size:17px}.content td,.content th{padding:5px 9px;text-align:left}.content thead{border-bottom:1px solid var(--muted)}.content ul,.content ol{padding-left:1.4em}
.katex-display{overflow-x:auto;overflow-y:hidden}.reveal-char{display:inline}
.annotation{position:absolute;pointer-events:none;overflow:visible}.write-pen{position:absolute;pointer-events:none;z-index:4;width:28px;height:28px;opacity:0;transform:translate(0,-26px)}.pen-body{transform-origin:bottom left;animation:pen-bob .7s ease-in-out infinite}
@keyframes pen-bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-2px) rotate(-1deg)}}
:root[data-paused=true] .pen-body{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.pen-body{animation:none}}
.content svg{max-width:100%;height:auto}audio{display:none}
.speech-caption{position:fixed;bottom:0;left:0;right:var(--webi-width,156px);padding:16px 24px;background:var(--paper);z-index:8;font:16px/1.65 var(--hand)}.speech-caption .speaking{color:var(--red)}
.silent-caption{position:fixed;bottom:0;left:0;right:var(--webi-width,156px);padding:16px 24px;background:var(--paper);z-index:8}.silent-caption .content{font-size:16px;line-height:1.65}
</style>
<main id="viewport" aria-label="白板画布"><div id="canvas"></div></main><div id="webi-host" aria-label="Webi 课堂伙伴"></div><div id="generation-waiting" role="status" hidden>正在准备下一页…<br>准备好后自动继续</div><audio id="narration"></audio>
<script src="voice-runtime.js"></script><script src="katex-runtime.js"></script><script src="mermaid-runtime.js"></script><script src="whiteboard-runtime.js"></script>
</html>
