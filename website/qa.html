    <h1 class="detail-heading" data-en="Frequently asked questions">常见问题</h1>
    <section class="faq-list" aria-label="魏碑常见问题" data-en-label="WeiBei frequently asked questions">
      <details open><summary data-en="What is WeiBei?">魏碑是什么？</summary><p data-en="A local macOS workspace that keeps reading, conversation, and notes in one window, so every question stays beside the material you are studying.">一个 macOS 本地学习工作台，把阅读、对话和笔记放在同一个窗口，让问题始终贴着正在看的材料。</p></details>
      <details><summary data-en="Will my materials leave my Mac?">资料会离开本机吗？</summary><p data-en="WeiBei manages your materials locally by default. When you use an online model, only the necessary context is sent to the provider you choose, and the app makes that scope clear.">魏碑优先在本机管理资料。调用在线模型时，必要内容会发送给你选择的服务，发送范围会在应用内明确说明。</p></details>
      <details><summary data-en="What can I use it for?">可以用来做什么？</summary><p data-en="Read a source, continue asking about a selection, and keep what matters in your notes.">打开材料阅读，围绕选区继续追问，再把值得留下的内容写进笔记。</p></details>
      <details><summary data-en="Is WeiBei open source?">魏碑是开源的吗？</summary><p data-en="Yes. The repository and release notes are available from the GitHub link on the homepage.">是。代码仓库与版本说明会从主页的 GitHub 入口进入。</p></details>
      <details><summary data-en="When can I download it?">什么时候可以下载？</summary><p data-en="The macOS installer will appear at the homepage download entry when it is released.">macOS 安装包发布后会直接出现在主页下载入口。</p></details>
