<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2e2ca" />
    <meta name="description" content="魏碑，一款为阅读、思考与写作而生的 macOS 应用。" />
    <meta property="og:title" content="魏碑 WeiBei" />
    <meta property="og:description" content="资料在左，问题在旁，笔记在手。" />
    <meta property="og:image" content="https://weibei-app.github.io/weibei/assets/brand/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://weibei-app.github.io/weibei/" />
    <title>魏碑 WeiBei</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preload" href="./assets/WeiBeiStele.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="./assets/WeiBeiSteleMono.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="./styles.css?v=11-full-window" />
  </head>
  <body>
    <a class="skip-link" href="#story">跳到产品故事</a>

    <main>
      <section class="scroll-run" id="story" aria-label="魏碑真实工作流">
        <div class="stage">
          <img class="stage-mark" src="./assets/mark-cutout.png" alt="" />

          <section class="frame scene hero" data-scene="hero">
            <header class="site-head">
              <a class="brand" href="#story" data-progress="0" aria-label="魏碑首页">
                <img src="./assets/app-icon.png" alt="" />
                <span><strong>魏碑</strong><small>WEIBEI</small></span>
              </a>
              <nav aria-label="主导航">
                <button type="button" data-stop="1">工作流</button>
                <button type="button" data-stop="3">出处</button>
                <button type="button" data-stop="5">资料与笔记</button>
                <a data-download-link href="https://github.com/weibei-app/weibei/releases">下载</a>
              </nav>
            </header>

            <div class="hero-copy">
              <div class="actions">
                <a class="button-line" data-download-link href="https://github.com/weibei-app/weibei/releases">
                  下载 macOS 版 <span>→</span>
                </a>
              </div>
            </div>
          </section>

          <section
            class="frame scene panes"
            data-scene="panes"
            aria-label="读、问、记"
            aria-hidden="true"
            inert
          >
            <header class="section-head">
              <a class="mini-brand" href="#story" data-progress="0">
                <img src="./assets/app-icon.png" alt="" />魏碑
              </a>
              <span class="folio">02 / 07</span>
            </header>
            <div class="pane-names" aria-label="三栏跳转">
              <button type="button" data-stop="2"><b>读</b><small>资料</small></button>
              <button type="button" data-stop="3"><b>问</b><small>Agent</small></button>
              <button type="button" data-stop="4"><b>记</b><small>笔记</small></button>
            </div>
          </section>

          <section
            class="frame scene context"
            data-scene="context"
            aria-label="应用演示"
            aria-hidden="true"
            inert
          >
            <header class="section-head light">
              <a class="mini-brand" href="#story" data-progress="0">
                <img src="./assets/app-icon.png" alt="" />魏碑
              </a>
              <span class="folio">03 / 07</span>
            </header>
          </section>

          <section
            class="frame scene provenance"
            data-scene="provenance"
            aria-label="应用演示"
            aria-hidden="true"
            inert
          >
            <header class="section-head dark">
              <a class="mini-brand" href="#story" data-progress="0">
                <img src="./assets/app-icon.png" alt="" />魏碑
              </a>
              <span class="folio">04 / 07</span>
            </header>
          </section>

          <section
            class="frame scene writeback"
            data-scene="writeback"
            aria-label="应用演示"
            aria-hidden="true"
            inert
          >
            <header class="section-head">
              <a class="mini-brand" href="#story" data-progress="0">
                <img src="./assets/app-icon.png" alt="" />魏碑
              </a>
              <span class="folio">05 / 07</span>
            </header>
          </section>

          <section
            class="frame scene relations"
            data-scene="relations"
            aria-label="资料关系台"
            aria-hidden="true"
            inert
          >
            <header class="section-head relation-head">
              <a class="mini-brand" href="#story" data-progress="0">
                <img src="./assets/app-icon.png" alt="" />魏碑
              </a>
              <span class="folio">06 / 07</span>
            </header>
          </section>

          <section
            class="frame scene finish"
            data-scene="finish"
            aria-labelledby="finish-title"
            aria-hidden="true"
            inert
          >
            <header class="section-head">
              <a class="mini-brand" href="#story" data-progress="0">
                <img src="./assets/app-icon.png" alt="" />魏碑
              </a>
              <span class="folio">07 / 07</span>
            </header>
            <img class="finish-mark" src="./assets/mark-cutout.png" alt="" />
            <div class="finish-copy">
              <p>资料在左，问题在旁，笔记在手。</p>
              <h2 id="finish-title">最后一笔，<br />由你落下。</h2>
              <a class="download" data-download-link href="https://github.com/weibei-app/weibei/releases">
                <img src="./assets/app-icon.png" alt="" />
                <span>下载 macOS 版</span>
                <b>→</b>
              </a>
            </div>
          </section>

          <div class="persistent-canvas" aria-hidden="true">
            <figure class="persistent-workspace">
              <img
                class="workspace-media workspace-static"
                src="./assets/three-pane-live.png"
                alt=""
              />
              <video
                class="workspace-media workspace-flow"
                src="./assets/workflow-live-scrub.mp4"
                poster="./assets/three-pane-live.png"
                muted
                playsinline
                preload="none"
              ></video>
              <img
                class="workspace-media workspace-relations-still"
                src="./assets/course-relations-live.png"
                alt=""
              />
              <video
                class="workspace-media workspace-relations"
                src="./assets/relations-live-scrub.mp4"
                poster="./assets/course-relations-live.png"
                muted
                playsinline
                preload="none"
              ></video>
            </figure>
          </div>
        </div>
        <div class="snap-points" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </section>

      <section class="mobile-story" aria-label="魏碑移动端故事预览">
        <article class="mobile-card mobile-hero">
          <img class="mobile-mark" src="./assets/mark-cutout.png" alt="" />
          <p>魏碑 · WEIBEI</p>
          <h2>资料在左，问题在旁，笔记在手。</h2>
        </article>
        <article class="mobile-card">
          <img src="./assets/three-pane-live.png" alt="魏碑三栏工作台" />
          <div><small>02 / 三栏</small><h2>读、问、记。</h2></div>
        </article>
        <article class="mobile-card mobile-crop-agent">
          <img src="./assets/three-pane-live.png" alt="魏碑 Agent 与笔记界面" />
          <div><small>03 / 应用</small><h2>同一个窗口，内容继续变化。</h2></div>
        </article>
        <article class="mobile-card">
          <img src="./assets/course-relations-live.png" alt="魏碑资料关系台" />
          <div><small>04 / 资料</small><h2>一切仍在魏碑里。</h2></div>
        </article>
      </section>
    </main>

    <script src="./main.js?v=11-full-window"></script>
  </body>
</html>
