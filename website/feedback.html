  <main class="detail-shell feedback-shell">
    <h1 class="detail-heading" data-en="Feedback">反馈</h1>
    <p class="detail-lead" data-en="Found a problem, or have a new idea? Tell us.">遇到问题，或有新的想法，告诉我们。</p>
    <form class="feedback-form" id="feedback-form">
      <fieldset class="feedback-kind">
        <legend data-en="What would you like to share?">你想说哪件事？</legend>
        <div class="feedback-kind-grid">
          <label class="feedback-kind-option">
            <input type="radio" name="type" value="issue" checked>
            <span><strong data-en="Experience issue">体验问题</strong><small>GitHub Issues</small></span>
          </label>
          <label class="feedback-kind-option">
            <input type="radio" name="type" value="feature">
            <span><strong data-en="Feature request">功能建议</strong><small>GitHub Ideas</small></span>
          </label>
          <label class="feedback-kind-option">
            <input type="radio" name="type" value="content">
            <span><strong data-en="Content &amp; copy">内容与表达</strong><small>GitHub Ideas</small></span>
          </label>
          <label class="feedback-kind-option">
            <input type="radio" name="type" value="other">
            <span><strong data-en="Other">其他</strong><small>GitHub General</small></span>
          </label>
        </div>
      </fieldset>
      <label class="feedback-field"><span data-en="Title">标题</span><input type="text" name="title" required maxlength="120" placeholder="一句话说清你遇到的问题或想法" data-en-placeholder="Describe the problem or idea in one sentence"></label>
      <label class="feedback-field"><span data-en="Details">具体内容</span><textarea name="message" required placeholder="发生了什么？你原本希望它怎样？" data-en-placeholder="What happened, and what did you expect instead?"></textarea></label>
      <div class="feedback-footer">
        <p class="feedback-disclosure" data-en="This will open a public GitHub submission page. Please do not include private information.">提交后会打开 GitHub 公开页面，请勿填写私密信息。</p>
        <button class="feedback-submit" type="submit" data-submit-zh="前往 GitHub Issue" data-submit-en="Continue to GitHub Issue">前往 GitHub Issue</button>
      </div>
      <p class="feedback-status" id="feedback-status" aria-live="polite"></p>
    </form>
  </main>
